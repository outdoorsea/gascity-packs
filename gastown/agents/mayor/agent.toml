scope = "city"
wake_mode = "fresh"
work_dir = ".gc/agents/mayor"
# Plain work_dir, not a worktree, so nothing else scaffolds it: without
# .remember/logs the remember plugin's hooks are dropped, not merely unlogged.
pre_start = ["{{.ConfigDir}}/assets/scripts/remember-scaffold.sh --create {{.WorkDir}}"]
idle_timeout = "1h"
