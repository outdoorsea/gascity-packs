# CONTRACT PIN — read before editing this file.
#
# The gastown-orchestration gate pins literal text fragments from this formula
# in GASTOWN_FORMULA_CONTRACTS / GASTOWN_BUILD_WORKFLOW_CONTRACTS
# (scripts/gascity_pack_inference_gate.py). Nothing below marks which lines they
# are, so list them before you edit:
#
#   python3 scripts/gascity_pack_inference_gate.py --list-formula-contracts mol-refinery-patrol
#
# Dropping a pinned fragment fails the gate and gets the branch rejected. If the
# contract genuinely changed, update the registry in the SAME commit — never
# delete a pin just to go green.
description = """
Refinery patrol loop. Poured as a root-only wisp on startup:

  gc gastown wisp-reconcile ensure mol-refinery-patrol --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}

That command pours AND assigns, and pours only if the agent does not
already own a wisp. Never bootstrap with a bare `gc bd mol wisp` — an
unguarded pour leaks a wisp on every restart.

Each wisp is ONE iteration: check for work, merge one branch, pour
the next iteration. On crash, re-read the formula steps and determine
where you left off from context (git state, bead state, last action).

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: every exit path (happy or early) pours the next
wisp before burning this one. The prompt only bootstraps the first wisp.

Work beads flow directly: pool → polecat → refinery → closed.
No separate MR beads. The polecat sets metadata (branch, target) on
the work bead and assigns it to the refinery. On rejection, the
refinery puts the bead back in the pool with rejection metadata.

Merge strategy is per-work-bead metadata:
- `direct` (default): fast-forward merge to target and push
- `mr` / `pr`: publish a GitHub pull request instead of landing directly

In `mr` mode, refinery publishes the pull request and hands the merge to a
human — but publication is NOT a completion. The bead stays OPEN carrying
`awaiting_merge=true` and the PR URL, and `find-work` re-checks every
awaiting bead each patrol, closing only the ones whose merge is VERIFIED
landed.

Closing on PR-open is what this replaces. A closed bead leaves `gc bd ready`,
pool-demand queries, and orphan scans at the same instant, so a green PR
that nobody merges has no open bead, no assignee, and no sling pointing at
it — nothing re-dispatches it and nothing merges it. It fails silently.
Three green PRs stranded that way in one day in rig tallyup; two were
rescued only because a witness patrol happened to notice.

Read each step's description before acting — Config values override defaults."""
formula = "mol-refinery-patrol"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.run_tests]
description = "Whether to run tests before merging"
default = "true"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.lint_command]
description = "Lint command (e.g., eslint .). Empty = skip."
default = ""

[vars.test_command]
description = "Test command to run (if run_tests is true)"
default = ""

[vars.build_command]
description = "Build command (e.g., go build ./...). Empty = skip."
default = ""

[vars.target_branch]
description = "Default target branch for merges"
default = "main"

[vars.delete_merged_branches]
description = "Whether to delete source branches after merge"
default = "true"

[vars.integration_branch_auto_land]
description = "Auto-create work beads to land completed integration branches"
default = "false"

[vars.event_timeout]
description = "Seconds to sleep before re-checking for work. Replaces former event-watch loop which hot-spun on cache-reconcile firehose."
default = "60"

[vars.awaiting_merge_stale_seconds]
description = "Seconds an `mr` PR may sit unmerged before the refinery escalates it once to the witness. 0 disables the escalation."
default = "3600"

[[steps]]
id = "validate-identity"
title = "Validate canonical agent identity"
description = """
**Fail fast if `$GC_AGENT` is not set.**

The refinery uses `$GC_AGENT` (not `$GC_ALIAS`) as its canonical mailbox
identity. The session harness
(`internal/session/lifecycle.go:RuntimeEnvWithSessionContext`) guarantees
`$GC_AGENT` is populated for every live session — it falls back to the
session name when the alias is empty. `$GC_ALIAS` can legitimately be
empty, which is how a refinery once self-polled for 13h42m with seven
queued beads while looking healthy-idle (upstream #1833).

Verify at startup:
```bash
if [ -z "${GC_AGENT:-}" ]; then
    echo "GC_AGENT is empty — session harness did not inject the canonical identity."
    echo "Refusing to self-poll with an empty filter; escalate before proceeding."
    gc mail send mayor/ -s "ESCALATION: refinery started with empty GC_AGENT [HIGH]" \\
        -m "Session has no canonical agent identity. Investigate session harness."
    gc runtime drain-ack
    exit 1
fi
```

Close this step only when `$GC_AGENT` is confirmed non-empty."""

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
needs = ["validate-identity"]
description = """
**1. Context check (FIRST — before any work):**

If context feels heavy (multi-hour session, large recent diffs, or you notice
yourself taking shortcuts or summarizing prematurely), pour and assign the next
wisp, burn the current wisp, then request a restart:
```bash
CURRENT_WISP=$(gc gastown wisp-reconcile current) || {
  echo "Could not resolve the current wisp; not pouring and not burning."
  gc runtime drain-ack
  exit 1
}
NEXT=$(gc gastown wisp-reconcile ensure mol-refinery-patrol --except "$CURRENT_WISP" --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}) || {
  echo "Could not guarantee exactly one next refinery wisp; not requesting restart."
  gc runtime drain-ack
  exit 1
}
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current wisp; not requesting restart."
  gc runtime drain-ack
  exit 1
fi
gc runtime request-restart
RESTART_STATUS=$?
echo "Restart request returned with status $RESTART_STATUS; stop this session now."
exit "$RESTART_STATUS"
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks until the
controller stops this session; on controller fault it can return nonzero after
a bounded timeout. If the command returns for any reason, stop immediately. Do
not check mail, close this step, or process merge work from this old session
after burning the current wisp. On the normal path, the controller kills and
restarts the session on the next reconcile tick. The new session wakes on the
wisp you just assigned and re-reads formula steps with fresh context.

**2. Check mail:**
```bash
gc mail inbox
```

Archive any messages you handle. Note any context relevant to
upcoming merge work (e.g., priority overrides, hold requests).

Close this step and proceed."""

[[steps]]
id = "find-work"
title = "Find next work bead assigned to me or wait"
needs = ["check-inbox"]
description = """
**Config: event_timeout = {{event_timeout}}**
**Config: awaiting_merge_stale_seconds = {{awaiting_merge_stale_seconds}}**

**1. Re-check every bead parked at `awaiting_merge` (do this FIRST):**

`mr` mode publishes a pull request and leaves the bead OPEN with
`awaiting_merge=true` until a human merges it. This block is the other half
of that contract: it is the ONLY place an `mr` bead closes, and it runs on
every patrol, so a PR that goes green and gets merged an hour after
publication is still noticed. Skipping it strands the bead forever.

This is a cheap poll by construction: it re-reads merge state and nothing
else. It does NOT rebase, force-push, re-run tests, or touch the PR — doing
any of that on a poll would reset the PR's checks every patrol iteration.

```bash
# --- AWAITING_MERGE_RECHECK ---
merge_landed() {
  # Content-aware "did this branch's work land on the target?" predicate.
  #
  # SHA ancestry alone is WRONG here, and getting it wrong is how PRs went
  # missing: the refinery rebases before publishing, and GitHub rewrites the
  # commits again on a squash or rebase merge, so
  # `git merge-base --is-ancestor origin/$BRANCH origin/$TARGET` answers "no"
  # for work that demonstrably landed. `git cherry` compares PATCH IDs rather
  # than SHAs -- it prints `-` for a commit whose diff is already upstream and
  # `+` for one that is not -- so it survives both rewrites.
  #
  #   exit 0 = every commit on the branch is present in the target
  #   exit 1 = at least one commit is missing, or the branch carries no
  #            verified commits at all (never evidence of a merge)
  #   exit 2 = could not evaluate -> fail closed; the caller must not close
  #
  # Known blind spot: a squash merge of a MULTI-commit branch collapses N
  # patches into one, so no per-commit patch-id matches and this returns 1.
  # That is the conservative direction (bead stays open), and the GitHub
  # `mergedAt` check below is the authoritative signal that covers it.
  ml_target="$1"
  ml_branch="$2"
  ml_fork="$3"
  ml_out=$(git cherry "$ml_target" "$ml_branch" 2>/dev/null) || return 2
  if [ -z "$ml_out" ]; then
    # The target already contains every branch commit by SHA. That is either a
    # landed branch or an empty one, and an empty branch is trivially
    # "contained" because its tip IS the fork point. Require recorded evidence
    # of >=1 real commit to tell them apart; without it, stay conservative.
    [ -n "$ml_fork" ] || return 1
    ml_count=$(git rev-list --count "$ml_fork..$ml_branch" 2>/dev/null) || return 2
    [ "$ml_count" -ge 1 ] || return 1
    return 0
  fi
  # Commits the target lacks by SHA still count as landed when every one of
  # them has an equivalent patch upstream ('-'), which is what a rebase-merge
  # leaves behind. A single '+' means something has not landed.
  printf '%s\\n' "$ml_out" | grep -q '^+' && return 1
  return 0
}

# A rig that overrides the var to empty must not crash the patrol on the
# arithmetic below; treat "unset" as "escalation disabled".
STALE_AFTER="{{awaiting_merge_stale_seconds}}"
[ -n "$STALE_AFTER" ] || STALE_AFTER=0
NOW_EPOCH=$(date -u +%s)

# `--limit=0` is unlimited: every parked bead gets polled, not just the first.
AWAITING=$(gc bd list ${GC_RIG:+--rig="$GC_RIG"} --assignee=$GC_AGENT --status=open \\
  --exclude-type=epic --metadata-field=awaiting_merge=true --limit=0 --json)
# An unreadable query is not an empty queue, but it must not feed `jq` an empty
# stdin either -- that errors out noisily and looks like "nothing parked".
[ -n "$AWAITING" ] || AWAITING='[]'

for AW in $(printf '%s' "$AWAITING" | jq -r '.[].id'); do
  AW_JSON=$(gc bd show "$AW" --json)
  AW_PR=$(printf '%s' "$AW_JSON" | jq -r '.[0].metadata.pr_number // empty')
  AW_URL=$(printf '%s' "$AW_JSON" | jq -r '.[0].metadata.pr_url // empty')
  AW_BRANCH=$(printf '%s' "$AW_JSON" | jq -r '.[0].metadata.branch // empty')
  AW_TARGET=$(printf '%s' "$AW_JSON" | jq -r '.[0].metadata.target // "{{target_branch}}"')
  AW_FORK=$(printf '%s' "$AW_JSON" | jq -r '.[0].metadata.fork_sha // empty')
  AW_SINCE=$(printf '%s' "$AW_JSON" | jq -r '.[0].metadata.awaiting_merge_since_epoch // empty')
  AW_STALE=$(printf '%s' "$AW_JSON" | jq -r '.[0].metadata.awaiting_merge_stale // empty')

  # (a) Ask GitHub first. `mergedAt` is authoritative and rewrite-proof: it is
  # true regardless of how the merge was performed, including the multi-commit
  # squash that the git-side predicate cannot see.
  #
  # The sha lives at `.mergeCommit.oid` -- `mergeCommit` is an OBJECT, and there
  # is no flat `mergeCommitOid` field. gh validates --json names CLIENT-SIDE and
  # rejects the ENTIRE query on one bad name, so a typo here does not degrade
  # this check, it deletes it: for every parked bead, on every rig, forever.
  AW_MERGED_AT=""
  AW_MERGE_SHA=""
  AW_API_ANSWERED=false
  if [ -n "$AW_PR" ] && command -v gh >/dev/null 2>&1; then
    # Keep stderr. Discarding it is precisely what let a bad field name live in
    # this path undetected: `2>/dev/null || printf ''` makes "gh rejected my
    # query" indistinguishable from "gh is not installed", and only the latter
    # is a legitimate reason to fall back quietly.
    AW_ERR_FILE=$(mktemp)
    AW_PR_JSON=$(gh pr view "$AW_PR" --json state,mergedAt,mergeCommit 2>"$AW_ERR_FILE") || AW_PR_JSON=""
    AW_ERR_TEXT=$(sed -n '1p' "$AW_ERR_FILE")
    rm -f "$AW_ERR_FILE"
    if [ -n "$AW_PR_JSON" ]; then
      AW_API_ANSWERED=true
      AW_MERGED_AT=$(printf '%s' "$AW_PR_JSON" | jq -r '.mergedAt // empty' 2>/dev/null)
      AW_MERGE_SHA=$(printf '%s' "$AW_PR_JSON" | jq -r '.mergeCommit.oid // empty' 2>/dev/null)
    else
      # gh is installed and still did not answer. Never let this be silent: this
      # is the ONLY check that sees a squash-merged multi-commit branch, so
      # losing it strands the bead open while its work already sits on target.
      case "$AW_ERR_TEXT" in
        *"Unknown JSON field"*)
          echo "AWAITING_MERGE: FORMULA BUG for $AW -- gh rejected this step's --json field list: ${AW_ERR_TEXT}"
          echo "AWAITING_MERGE: the authoritative mergedAt signal is DEAD until those field names are fixed; a squash-merged multi-commit PR cannot be detected and its bead will never close. This does not clear on retry."
          ;;
        *)
          echo "AWAITING_MERGE: gh could not answer for $AW (PR ${AW_URL:-#$AW_PR}): ${AW_ERR_TEXT:-no stderr}; using the git-side predicate for this patrol."
          ;;
      esac
    fi
  fi

  # (b) The API is authoritative in BOTH directions, so consult git only when
  # it did not answer at all (no gh, no token, PR number lost). A readable
  # "mergedAt: null" is a real "not merged" verdict, and letting a git error
  # override it would skip the staleness escalation below on a PR we know is
  # sitting there. A git tool error is likewise not a merge -- leave the bead
  # alone and let the next patrol retry rather than guessing.
  if [ -z "$AW_MERGED_AT" ] && [ "$AW_API_ANSWERED" != "true" ] && [ -n "$AW_BRANCH" ]; then
    git fetch origin "+refs/heads/${AW_BRANCH}:refs/remotes/origin/${AW_BRANCH}" \\
                     "+refs/heads/${AW_TARGET}:refs/remotes/origin/${AW_TARGET}" >/dev/null 2>&1 || true
    merge_landed "origin/$AW_TARGET" "origin/$AW_BRANCH" "$AW_FORK"
    case "$?" in
      0)
        AW_MERGED_AT="git-verified"
        AW_MERGE_SHA=$(git rev-parse "origin/$AW_TARGET" 2>/dev/null || printf '')
        ;;
      1) : ;;
      *)
        echo "AWAITING_MERGE: could not evaluate merge state for $AW (git error); leaving it open for the next patrol."
        continue
        ;;
    esac
  fi

  # (c) Verified landed -> this is the close the mr path owes. Write the
  # forensics and the close as one chained command so a closed bead can never
  # lack the merge breadcrumbs that prove why it closed.
  if [ -n "$AW_MERGED_AT" ]; then
    # Deployment verdict, exactly as the merge-push closes do. `mr` is the one
    # path whose commit can be imprecise: the PR's `mergeCommit.oid` names the
    # fix, while the git-verified fallback records the tip of $AW_TARGET. A
    # tip that has moved on can only over-report "not deployed", never
    # under-report it, so the error direction keeps the bead visible rather
    # than hiding it.
    DEPLOY_NOTE=$(gc gastown deploy-check "${AW_MERGE_SHA:-unknown}" --stamp "$AW" 2>/dev/null || true)
    if gc bd update "$AW" \\
         --set-metadata merge_result=merged \\
         --set-metadata merged_target="$AW_TARGET" \\
         --set-metadata merged_sha="${AW_MERGE_SHA:-unknown}" \\
         --unset-metadata awaiting_merge \\
         --unset-metadata awaiting_merge_since \\
         --unset-metadata awaiting_merge_since_epoch \\
         --unset-metadata awaiting_merge_stale \\
         --unset-metadata rejection_reason && \\
       gc bd close "$AW" --reason "Merged to $AW_TARGET via PR ${AW_URL:-#$AW_PR} (verified at $AW_MERGED_AT)$DEPLOY_NOTE"; then
      echo "AWAITING_MERGE: $AW merged and closed (PR ${AW_URL:-#$AW_PR}, $AW_MERGED_AT)."
    else
      echo "AWAITING_MERGE: $AW is merged but the close did not land; bead stays open. A later patrol retries."
    fi
    continue
  fi

  # (d) Still unmerged. That is legal -- a human owns the merge -- but it must
  # not be silent forever. Escalate EXACTLY ONCE, when it first crosses the
  # staleness threshold, so a stuck PR surfaces without the patrol nagging on
  # every iteration.
  if [ "$STALE_AFTER" -gt 0 ] && [ -n "$AW_SINCE" ] && [ "$AW_STALE" != "true" ] \\
     && [ $((NOW_EPOCH - AW_SINCE)) -ge "$STALE_AFTER" ]; then
    gc bd update "$AW" --set-metadata awaiting_merge_stale=true
    gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" "AWAITING MERGE $(( (NOW_EPOCH - AW_SINCE) / 60 ))m: $AW — PR ${AW_URL:-#$AW_PR} is published and unmerged; bead deliberately left open."
    echo "AWAITING_MERGE: $AW stale ($(( (NOW_EPOCH - AW_SINCE) / 60 ))m unmerged); escalated once to witness."
  else
    echo "AWAITING_MERGE: $AW still unmerged (PR ${AW_URL:-#$AW_PR}); left open."
  fi
done
```

**2. Triage every bead marked `no_code_change` (before any merge selection):**

A bead carrying `no_code_change=true` has a deliverable that is not a patch:
verdicts recorded in an external tracker, a state correction elsewhere, an
investigation's findings. It must never reach the merge selector in step 3. A
merge queue asserts exactly one thing — "this branch landed on the target" — and
for a zero-diff branch that is unprovable, so `branch_has_real_change()` refuses
and `halt_false_completion` fires, every single time.

**That halt stays.** Refusing to close a zero-diff bead as merged is exactly
what catches a polecat that died having produced nothing. The defect was routing
non-patch work into a patch-merger at all (gp-d5u, observed on ta-af7).

This pass is the refinery's second terminal transition, alongside merge. It
deliberately does **not** auto-close. Bead metadata carries no provenance —
`gc bd history` versions the issue row but not its metadata — so nothing here
can distinguish a flag set by the filer at dispatch from one a polecat set on
itself. Closing on the flag alone would hand every polecat a one-key escape from
the false-completion guard, which is strictly worse than the halt it would
replace. So this pass verifies what IS mechanically checkable (the branch really
is empty, and it really exists), then hands a human a decision that takes
seconds because the evidence travels with it.

```bash
# --- NO_PATCH_TRIAGE ---
branch_is_empty() {
  # Exact complement of merge-push's branch_has_real_change(), redefined here
  # because each formula step is its own shell. Kept literally inverse on every
  # arm, including the loose `|| echo 0` on the commit count: if these two
  # predicates ever disagree, a bead falls between them and NEITHER path accepts
  # it, which is a worse failure than either arm's individual conservatism.
  #   0 = verified empty (no net diff vs the merge base)
  #   1 = verified to carry a real change
  #   2 = could not evaluate -> caller must not act
  bie_base=$(git merge-base "$1" "$2" 2>/dev/null) || return 2
  git diff --quiet "$bie_base" "$2"
  case "$?" in
    0) return 0 ;;  # no net diff -> empty, whatever the commit count says
    1) : ;;         # diff present -> confirm it carries commits too
    *) return 2 ;;  # git diff errored -> cannot evaluate
  esac
  [ "$(git rev-list --count "$bie_base..$2" 2>/dev/null || echo 0)" -ge 1 ] || return 0
  return 1
}

# `--metadata-field` matches the stored JSON boolean that
# `--set-metadata no_code_change=true` writes; an unreadable query is not an
# empty queue, but it must not feed jq empty stdin either.
NO_PATCH=$(gc bd list ${GC_RIG:+--rig="$GC_RIG"} --assignee=$GC_AGENT --status=open \\
  --exclude-type=epic --metadata-field=no_code_change=true --limit=0 --json)
[ -n "$NO_PATCH" ] || NO_PATCH='[]'

for NP in $(printf '%s' "$NO_PATCH" | jq -r '.[].id'); do
  NP_JSON=$(gc bd show "$NP" --json)
  NP_BRANCH=$(printf '%s' "$NP_JSON" | jq -r '.[0].metadata.branch // empty')
  NP_TARGET=$(printf '%s' "$NP_JSON" | jq -r '.[0].metadata.target // "{{target_branch}}"')
  NP_EVIDENCE=$(printf '%s' "$NP_JSON" | jq -r '.[0].metadata.no_code_change_evidence // empty')

  if [ -z "$NP_BRANCH" ]; then
    echo "NO_PATCH: $NP carries no metadata.branch, so there is nothing to verify against. Left open; the witness owns beads with no branch."
    continue
  fi

  git fetch origin "+refs/heads/${NP_BRANCH}:refs/remotes/origin/${NP_BRANCH}" \\
                   "+refs/heads/${NP_TARGET}:refs/remotes/origin/${NP_TARGET}" >/dev/null 2>&1 || true
  if ! git show-ref --verify --quiet "refs/remotes/origin/${NP_BRANCH}"; then
    echo "NO_PATCH: origin/$NP_BRANCH does not exist for $NP. Absence is NOT evidence of a deliberate no-patch outcome — it is also exactly what a polecat that died before pushing looks like. Left open; the witness owns dead sessions."
    continue
  fi

  branch_is_empty "origin/$NP_TARGET" "origin/$NP_BRANCH"
  case "$?" in
    1)
      # It carries a real change, so the flag is WRONG. Strip it and let step 3
      # pick the bead up on this same patrol. Always fail toward merging real
      # work: a dropped patch is unrecoverable, a spurious merge attempt costs
      # one iteration.
      gc bd update "$NP" \\
        --unset-metadata no_code_change \\
        --set-metadata no_code_change_cleared="origin/$NP_BRANCH carries a verified real change vs origin/$NP_TARGET; the flag was wrong" \\
        --notes "no_code_change=true was set, but origin/$NP_BRANCH introduces a real change vs origin/$NP_TARGET. Cleared the flag and released it to the merge queue: a patch that exists must be merged, whatever the flag claimed."
      echo "NO_PATCH: $NP flag cleared — origin/$NP_BRANCH has a real change and belongs in the merge queue."
      continue
      ;;
    0) : ;;  # verified empty -> the flag matches reality; fall through to the handoff
    *)
      echo "NO_PATCH: could not evaluate origin/$NP_BRANCH vs origin/$NP_TARGET for $NP (git tool error). Fail closed — left open for the next patrol."
      continue
      ;;
  esac

  NP_SHA=$(git rev-parse --short "origin/$NP_BRANCH" 2>/dev/null || printf 'unknown')
  gc bd update "$NP" \\
    --status=blocked \\
    --assignee="" \\
    --set-metadata merge_result=no_patch_needs_human \\
    --set-metadata gc.routed_to=human \\
    --set-metadata no_patch_verified="origin/$NP_BRANCH ($NP_SHA) confirmed zero-diff vs origin/$NP_TARGET by the refinery; deliberate no-patch outcome, NOT a dead polecat" \\
    --notes "NO PATCH TO MERGE — the refinery confirmed origin/$NP_BRANCH ($NP_SHA) introduces no change vs origin/$NP_TARGET, which is the intended outcome for a no_code_change bead.
This is NOT a false completion: the branch exists on origin and is deliberately empty, so the polecat ran to completion rather than dying.
Polecat evidence: ${NP_EVIDENCE:-(none recorded — ask why before closing)}
HUMAN CALL, and it should take seconds: confirm the deliverable at the source named above, then close as done-without-merge. Nothing to merge, nothing to rebase, no branch to resume.
Not auto-closed on purpose: bead metadata carries no provenance, so no_code_change alone cannot be told apart from a polecat self-certifying out of a build it could not finish."
  gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" "NO PATCH: $NP — zero-diff confirmed benign (no_code_change=true); routed to human for a done-without-merge close. Not a false completion."
  echo "NO_PATCH: $NP confirmed benign zero-diff; blocked and routed to human with the evidence attached."
done
```

Routing to `human` rather than back to the polecat pool is deliberate, and it
mirrors the polecat's already-delivered halt: the bead needs one cheap decision
("close it as done, or re-scope it") and must never fall back into the pool,
which would spend another session reaching the same dead end. Unlike
`refused_false_completion` — a negative inference with nothing to act on —
`no_patch_needs_human` carries positive evidence, so the two are distinguishable
at a glance and only one of them warrants an investigation.

**3. Select the next work bead:**

Search for work beads assigned to you with branch metadata, skipping the
`awaiting_merge` beads step 1 just polled and the `no_code_change` beads step 2
just triaged:
```bash
WORK=$(gc bd list ${GC_RIG:+--rig="$GC_RIG"} --assignee=$GC_AGENT --status=open \
  --exclude-type=epic --has-metadata-key=branch --limit=0 --json \
  | jq -r '[.[] | select(((.metadata.awaiting_merge // "") | tostring) != "true")
                | select(((.metadata.no_code_change // "") | tostring) != "true")][0].id // empty')
```

Both exclusions are load-bearing, not cosmetic. `awaiting_merge` beads stay open
and assigned to the refinery on purpose, so a plain `--limit=1` query would keep
handing back the same parked PR and starve every other branch in the queue — the
merge queue would livelock behind one PR waiting on a human. `no_code_change`
beads have no patch to merge, so selecting one guarantees the false-completion
halt that step 2 exists to prevent.

**Both comparisons must go through `tostring`.** `--set-metadata k=true` stores
a JSON **boolean**, and in jq `true != "true"` is TRUE, so comparing the raw
field against the string `"true"` excludes nothing at all. The filter still
reads as present and load-bearing while doing exactly nothing — which is how the
`awaiting_merge` exclusion shipped inert (found while fixing gp-d5u). The
`--metadata-field=k=true` flag used in steps 1 and 2 does match the boolean;
only in-jq comparisons need the cast.

**Fix the reader, never the writer.** Normalizing on read tolerates both
spellings, so beads already parked in the wild with the boolean stay parked. Do
NOT resolve a future recurrence by making the writer emit a string — that
strands every already-parked bead in exactly the livelock described above, with
no migration to catch them.

One quirk to keep in mind if either predicate is ever rewritten: `//` is jq's
alternative operator, so it falls through on `false` as well as `null`. A
boolean `false` therefore collapses to `""` before `tostring` runs, and the
bead is correctly treated as not parked.

This is a class, not a rule about these two lines: any in-jq comparison of a
metadata field against a quoted `"true"`/`"false"` has the same defect.
`scripts/gascity_pack_inference_gate.py` scans every formula and agent prompt in
the pack for that shape and fails the gate on an un-cast read, so a *new*
filter cannot ship inert the way `awaiting_merge` did (gp-dc0). Adding one is
fine — write the `tostring` cast and the gate stays quiet.

`${GC_RIG:+--rig="$GC_RIG"}` scopes the query to this refinery's rig
database. Without it, `gc bd list` routes to the HQ database and never
sees rig-scoped work beads — the `assignee` field alone does not route
by namespace. For HQ-only refineries `$GC_RIG` is empty and the flag
expands to nothing.

**3b. Address-agnostic fallback sweep (runs only when step 3 selected nothing):**

Step 3 and the startup orphan scan are not two independent detectors. Step 3
matches `assignee == $GC_AGENT`; the orphan scan matches `gc.routed_to ==` this
refinery's address. Both compare the same address string, so both go blind to
the same defect at the same instant: a producer that writes a merge handoff to a
MISSPELLED refinery address matches neither, and the bead sits open, correctly
branched, fully pushed, and completely invisible while the refinery reports an
empty queue and idles. The orphan scan is documented as the fallback that
catches what the inbox missed, and it catches nothing here — a correct handoff
CLEARS `gc.routed_to`, so empty is the healthy shape and the scan has no address
left to match on.

Measured on the live tallyup ledger: `assignee='tallyup/refinery'` and
`assignee='tallyup/gastown.refinery'` each held open merge work. The refinery
only ever queried one form. Neither instance was found by anything in this
formula — one surfaced from `git branch -r --no-merged origin/main` during an
unrelated recheck, the other from a hand-run sweep that ignored assignee
entirely and found 1 stranded bead among 186 open ones. The same sweep run
town-wide caught a live P0 stranded six minutes after handoff.

This is the third path, and it is deliberately keyed on a DIFFERENT attribute
than the other two, because redundancy that keys on the same field is not
redundancy. It never reads the assignee at all, so it degrades gracefully
against address forms nobody has invented yet.

It is the consumer-side half of a two-part fix. The producer side (gp-0fz, a
`binding_prefix` that renders empty) stops NEW bad addresses from being written;
this sweep is what makes the refinery survive the ones already in the wild, plus
whatever the next producer bug invents. Fixing only the producer leaves every
already-stranded bead stranded, and nothing would report it.

Ignoring the assignee is affordable because within this state machine an open
bead is claimed by its OTHER metadata, and every one of those claims is checked:

| Shape | Marker | Who owns it |
|---|---|---|
| Parked PR | `awaiting_merge=true` | step 1 |
| Non-patch deliverable | `no_code_change=true` | step 2 |
| Refinery rejected it | `rejection_reason` set | the polecat pool |
| Halted before push | `branch_ready=true` / `halt_reason` | the caller |
| Any pool demand | `gc.routed_to` non-empty | whoever it names |

What survives those exclusions — open, carrying a branch, routed to nobody — is
by construction a completed handoff, because a correct handoff is the only
transition that clears `gc.routed_to` while leaving the bead open with a branch.
The one remaining question is whether its address is spelled in a form this
refinery queries, and that is precisely the bug.

Two further checks demand positive evidence that a polecat actually finished, so
a dead session's half-built branch is never mistaken for a handoff:

- **`metadata.target` must be set.** `workspace-setup` records `branch` EARLY,
  before any implementation; only the polecat's submit step writes `target`. It
  is the one attribute that means "a polecat completed the handoff" without
  naming an address.
- **`origin/<branch>` must exist.** A branch recorded but never pushed is a
  polecat that died, which the witness owns — not a merge.

Neither failure is swallowed. A branch-carrying bead that nobody owns and that
fails an evidence check is stranded in a way no other mechanism reports either,
so it gets a line naming the bead, its branch, and the address it was wearing.

```bash
# --- ADDRESS_AGNOSTIC_SWEEP ---
# Guarded on the "queue empty" verdict, which is exactly the moment a
# misaddressed handoff is invisible and the refinery would otherwise idle.
if [ -z "${WORK:-}" ]; then
  SWEEP=$(gc bd list ${GC_RIG:+--rig="$GC_RIG"} --status=open \\
    --exclude-type=epic --has-metadata-key=branch --limit=0 --json)
  # An unreadable query is not an empty ledger, and it must not feed jq an empty
  # stdin either -- that errors out noisily and looks like "nothing stranded".
  [ -n "$SWEEP" ] || SWEEP='[]'

  # No --assignee anywhere in this pipeline. The assignee string is the thing
  # that is wrong, so consulting it would reproduce the blindness this exists to
  # cover. Every comparison goes through `tostring` for the same reason step 3's
  # do: `--set-metadata k=true` stores a JSON boolean, and in jq `true != "true"`
  # is TRUE, so a raw compare reads as load-bearing while excluding nothing.
  SWEEP_UNOWNED=$(printf '%s' "$SWEEP" | jq -r '
    def field($k): ((.metadata[$k] // "") | tostring);
    .[]
    | select(field("awaiting_merge")   != "true")
    | select(field("no_code_change")   != "true")
    | select(field("branch_ready")     != "true")
    | select(field("rejection_reason") == "")
    | select(field("halt_reason")      == "")
    | select(field("gc.routed_to")     == "")
    | .id')

  for SW in $SWEEP_UNOWNED; do
    SW_JSON=$(gc bd show "$SW" --json)
    SW_BRANCH=$(printf '%s' "$SW_JSON" | jq -r '.[0].metadata.branch // empty')
    SW_TARGET=$(printf '%s' "$SW_JSON" | jq -r '.[0].metadata.target // empty')
    SW_ADDR=$(printf '%s' "$SW_JSON" | jq -r '.[0].assignee // empty')
    [ -n "$SW_ADDR" ] || SW_ADDR="<unassigned>"

    if [ -z "$SW_TARGET" ]; then
      echo "SWEEP: $SW carries branch '$SW_BRANCH' but no metadata.target (addressed to '$SW_ADDR'); only the polecat's submit step writes target, so there is no completed handoff to act on. Left for the witness."
      continue
    fi

    # ls-remote asks origin directly, so the verdict does not depend on how
    # stale this worktree's fetch state happens to be.
    git ls-remote --exit-code --heads origin "$SW_BRANCH" >/dev/null 2>&1
    case "$?" in
      0) : ;;
      2)
        echo "SWEEP: $SW claims branch '$SW_BRANCH' (addressed to '$SW_ADDR') but origin has no such ref. That is a polecat that died before pushing, not a merge. Left for the witness."
        continue
        ;;
      *)
        echo "SWEEP: could not reach origin to verify '$SW_BRANCH' for $SW; failing closed and leaving it for the next patrol."
        continue
        ;;
    esac

    # Adopt it, and repair the address while doing so. The repair is the point:
    # it puts the bead back where BOTH prescribed paths can see it, so this
    # sweep never has to be the thing that finds the same bead twice.
    if gc bd update "$SW" --assignee="$GC_AGENT" \\
         --set-metadata address_repaired_from="$SW_ADDR" \\
         --notes "Address-agnostic sweep adopted this bead. It was open, unrouted, and carried branch '$SW_BRANCH' with target '$SW_TARGET' -- the shape of a completed polecat handoff -- but was addressed to '$SW_ADDR', which no refinery discovery path queries. Reassigned to $GC_AGENT so the merge queue can see it. The address itself is a producer-side defect: whatever wrote it will keep writing it."; then
      WORK="$SW"
      echo "SWEEP: adopted $SW as merge work (was addressed to '$SW_ADDR'; branch $SW_BRANCH -> $SW_TARGET)."
      gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" "SWEEP: $SW was invisible to both refinery discovery paths (addressed to '$SW_ADDR'); adopted it and merging. The producer is writing an address nothing queries."
      break
    fi
    echo "SWEEP: $SW is merge work but the reassignment did not land; left open for the next patrol."
  done
fi
```

The sweep selects at most one bead and stops. It is a selector, not a batch
job — the merge pipeline below handles one branch per patrol iteration, and the
next iteration sweeps again, so a queue of misaddressed beads drains one per
patrol rather than all at once.

Do NOT "simplify" the guard away and run this sweep unconditionally. It reads
every open branch-carrying bead in the ledger, and step 3 is both cheaper and
authoritative when it answers. Idle is the only moment this is needed, and idle
is the exact symptom the bug produces.

If found (by step 3 or the sweep): read the bead metadata to confirm it has a
branch:
```bash
gc bd show $WORK --json | jq '.[0].metadata'
```
The bead MUST have `metadata.branch`. If `metadata.target` is missing,
use {{target_branch}} as default. Note the work bead ID and close this step.

If NO work found — meaning step 3 selected nothing AND the sweep adopted
nothing:
Write exactly:
```
IDLE: no work, exiting turn.
```
Then stop immediately. Do NOT sleep, call ScheduleWakeup, or use Monitor.
The session_sleep policy will restart this session after the configured idle interval.
When restarted, re-read formula steps — this step stays open until a work bead is found.

**Do not close this step until you have a work bead with branch metadata.**"""

[[steps]]
id = "rebase"
title = "Rebase branch on target"
needs = ["find-work"]
description = """
**Config: target_branch = {{target_branch}}**

Read the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

Fetch and attempt mechanical rebase:
```bash
git fetch --prune origin
git checkout -b temp origin/$BRANCH
git rebase origin/$TARGET
```

If rebase SUCCEEDED (exit 0): close this step, proceed to run-tests.

If rebase FAILED (conflicts):

1. Abort: `git rebase --abort`
2. Reopen the source bead for a NEW round:
```bash
gc gastown reopen-source $WORK
```
This clears the stale workflow subtree, reopens and unassigns, parks the
disposition you just wrote under `round<N>.*`, and routes the bead — one
atomic update, nothing left for you to remember. Your verdict was accurate
about round 1 and says nothing about round 2, so leaving `merge_result` /
`no_patch_verified` in the current-round keys makes the next reader conclude
the bead is already dispositioned (gp-8r1).

Do NOT set `gc.routed_to` yourself afterwards. The command routes, and it
deliberately withholds pool routing from a bead carrying a validator roster;
re-routing here hands the barred agent the bead it is barred from validating.

3. Attach the reason for the next round:
```bash
gc bd update $WORK \
  --set-metadata rejection_reason="Conflicts with $TARGET at $(git rev-parse origin/$TARGET)"
```
4. Do NOT delete the branch (new polecat needs it for conflict resolution).
5. Clean up temp branch: `git checkout {{target_branch}} && git branch -D temp`
6. Pour next patrol iteration before burning:
```bash
CURRENT_WISP=$(gc gastown wisp-reconcile current) || {
  echo "Could not resolve the current wisp; not pouring and not burning."
  gc runtime drain-ack
  exit 1
}
NEXT=$(gc gastown wisp-reconcile ensure mol-refinery-patrol --except "$CURRENT_WISP" --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}) || {
  echo "Could not guarantee exactly one next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
}
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
```
7. Close this step after the current wisp is burned.

**A new polecat will pick up the bead, see the branch and rejection,
rebase, and reassign to refinery.**"""

[[steps]]
id = "run-tests"
title = "Run quality checks and tests"
needs = ["rebase"]
description = """
**Config: run_tests = {{run_tests}}**
**Config: test_command = {{test_command}}**
**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**

Run each configured check in order (skip empty ones silently):
```bash
{{setup_command}}
{{typecheck_command}}
{{lint_command}}
{{build_command}}
```

If run_tests = "true":
```bash
{{test_command}}
```

If run_tests = "false": skip tests entirely.

**Fallback when this wisp has no quality-gate commands configured** (all of
setup_command, typecheck_command, lint_command, build_command, test_command
empty): do not silently skip. Read the repo's project-instructions file
(CLAUDE.md or AGENTS.md — whichever the configured provider expects; your
agent prompt lists the exact filename) and run the quality gates it
documents. Treat their failures the same way you would treat failures
from configured commands. The fallback preserves the quality-gate intent
when pack-specific guidance is missing.

Track results: which checks ran, pass/fail, specific failures.
Close this step when all checks complete (pass or fail)."""

[[steps]]
id = "handle-failures"
title = "Handle quality check or test failures"
needs = ["run-tests"]
description = """
If all checks and tests PASSED: close this step, proceed to merge-push.

If any check or test FAILED:

Read the current branch and target again:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

1. Diagnose: branch regression or pre-existing on target?

2. If branch caused it:
   - Reopen the source bead for a NEW round. This reopens, unassigns, parks
     the disposition you just wrote under `round<N>.*` so the next polecat
     cannot read your verdict as its own, and routes the bead itself (gp-8r1):
     ```bash
     gc gastown reopen-source $WORK
     ```
     Do NOT set `gc.routed_to` yourself afterwards; the command routes, and
     withholds pool routing from validator-roster beads on purpose.
   - Attach the reason for the next round:
     ```bash
     gc bd update $WORK \
       --set-metadata rejection_reason="<failure summary>"
     ```
   - Delete branch: `git push origin --delete $BRANCH`
   - Clean up: `git checkout "$TARGET" && git branch -D temp`
   - Pour next patrol iteration before burning:
     ```bash
     CURRENT_WISP=$(gc gastown wisp-reconcile current) || {
       echo "Could not resolve the current wisp; not pouring and not burning."
       gc runtime drain-ack
       exit 1
     }
     NEXT=$(gc gastown wisp-reconcile ensure mol-refinery-patrol --except "$CURRENT_WISP" --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}) || {
       echo "Could not guarantee exactly one next refinery wisp; not burning."
       gc runtime drain-ack
       exit 1
     }
     if [ -n "$CURRENT_WISP" ]; then
       gc bd mol burn "$CURRENT_WISP" --force
     else
       echo "Could not resolve current wisp; not burning."
       gc runtime drain-ack
       exit 1
     fi
     ```
   - Close this step after the current wisp is burned.

3. If pre-existing on target:
   - Check for duplicates first:
     ```bash
     gc bd list --type=bug --status=open --search "<failure summary>"
     ```
   - If a matching bug already exists: note its ID and proceed with merge.
   - If no duplicate: file a new bead:
     ```bash
     gc bd create --type=bug --priority=1 --title="Pre-existing failure: <summary>"
     ```
   - Proceed with merge (failure not caused by this branch)

**GATE**: Cannot merge without all checks passing OR pre-existing bug filed/found.
**FORBIDDEN**: Writing code to fix failures. You are a merge processor."""

[[steps]]
id = "merge-push"
title = "Merge and push"
needs = ["handle-failures"]
description = """
**Config: target_branch = {{target_branch}}**
**Config: delete_merged_branches = {{delete_merged_branches}}**

Three merge strategies exist. Pick by target-branch protection, not by habit:

| Strategy | Pushes to `$TARGET`? | Waits for checks? | Merges? | Closes bead? |
|---|---|---|---|---|
| `direct` | yes, `git push` | no | yes (ff-only) | yes, after a verified push |
| `mr` (alias `pr`) | no | no | no — a human does | NO. Parks at `awaiting_merge`; `find-work` closes it once the merge lands |
| `pr-merge` | no | yes, required checks | yes, via `gh pr merge` | only after the merge is verified |

`direct` is only legal against an UNPROTECTED target. A protected branch
rejects `git push origin HEAD:$TARGET` outright, so a refinery that keeps
choosing `direct` stops landing work entirely. `mr` does not fill that gap:
it never waits for checks and never merges — it publishes a PR and waits
for a human. `pr-merge` is the mode that actually lands work on a protected
branch.

No strategy closes a bead on anything short of a verified merge. `mr` used
to, and the PRs it closed over stopped being tracked by anything.

Read the merge target and merge strategy from the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
MERGE_STRATEGY=$(gc bd show $WORK --json | jq -r '.[0].metadata.merge_strategy // empty')
EXISTING_PR=$(gc bd show $WORK --json | jq -r '.[0].metadata.existing_pr // empty')
# ORIGIN_REPO is the repo this refinery PUSHES TO, so it has to be read off the
# origin remote itself. `gh repo view` answers a different question -- on a fork
# it reports the PARENT -- and every probe below then reads branch protection in
# a repo the refinery never writes to. That misread is silent and it is total: a
# protected upstream turns an unprotected origin into merge_strategy=pr-merge,
# the direct path's own second guard refuses the very push it was about to make,
# and any PR the pr-merge path opens is scoped to the wrong repository.
#
# So resolve identity from git and use gh only to CALL the API. `gh api` takes an
# explicit repos/<owner>/<name>/... path, so nothing here needs gh to work out
# which repo it is talking about. Both the gh and no-gh paths now agree, because
# there is only one path.
#
# github.com only, deliberately: the REST fallback hardcodes api.github.com and
# every PR-URL parser in this step matches on github.com, so a GHE origin has
# nowhere to go and should say so here rather than fail later and further away.
ORIGIN_REPO=""
ORIGIN_REPO_ERROR=""
if ! ORIGIN_URL=$(git remote get-url origin 2>&1); then
  ORIGIN_REPO_ERROR="Could not resolve origin repository: git remote get-url origin failed: $ORIGIN_URL"
  ORIGIN_URL=""
fi
case "$ORIGIN_URL" in
  "")
    ;;
  git@github.com:*|https://github.com/*|ssh://git@github.com/*)
    ORIGIN_REPO=$(printf '%s\n' "$ORIGIN_URL" \
      | sed -E 's#^ssh://git@github.com/##; s#^git@github.com:##; s#^https://github.com/##; s#\\.git$##; s#/+$##')
    ;;
  *)
    ORIGIN_REPO_ERROR="Only github.com origin remotes are supported; origin is $ORIGIN_URL."
    ;;
esac
case "$MERGE_STRATEGY" in
  pr) MERGE_STRATEGY="mr" ;;
  pr_merge|pr-land) MERGE_STRATEGY="pr-merge" ;;
esac

# Probe target-branch protection. Sets three globals; call it directly (NOT in
# `$( )`) so the assignments survive.
#
#   TARGET_PROTECTED       true | false | unknown | unknown_no_gh
#   TARGET_PROTECTION_JSON the /protection payload when readable, else empty
#   REQUIRED_CONTEXTS      newline-separated required status-check contexts
#
# Two endpoints, because neither alone is sufficient:
#   * `branches/$T/protection` returns the rule detail we need to know WHICH
#     checks are required, but it 404s for a non-admin token even on a branch
#     that IS protected — a 404 alone must never be read as "unprotected".
#   * `branches/$T` needs only pull access and reports `.protected`, which is
#     true for classic protection AND for rulesets. It disambiguates the 404
#     but carries no context list.
TARGET_PROTECTED="unknown"
TARGET_PROTECTION_JSON=""
REQUIRED_CONTEXTS=""
probe_target_protection() {
  ptp_target="$1"
  TARGET_PROTECTED="unknown"
  TARGET_PROTECTION_JSON=""
  REQUIRED_CONTEXTS=""
  if ! command -v gh >/dev/null 2>&1; then
    TARGET_PROTECTED="unknown_no_gh"
    return 0
  fi
  if [ -z "$ORIGIN_REPO" ]; then
    return 0
  fi
  if TARGET_PROTECTION_JSON=$(gh api "repos/$ORIGIN_REPO/branches/$ptp_target/protection" 2>/dev/null); then
    TARGET_PROTECTED="true"
    # Classic protection exposes required contexts in two shapes depending on
    # repo age: `.contexts[]` (legacy strings) and `.checks[].context`.
    REQUIRED_CONTEXTS=$(printf '%s\n' "$TARGET_PROTECTION_JSON" \
      | jq -r '[(.required_status_checks.contexts // [])[], (.required_status_checks.checks // [])[].context] | unique | .[]' 2>/dev/null)
    return 0
  fi
  TARGET_PROTECTION_JSON=""
  ptp_flag=$(gh api "repos/$ORIGIN_REPO/branches/$ptp_target" --jq '.protected' 2>/dev/null)
  case "$ptp_flag" in
    true) TARGET_PROTECTED="true" ;;
    false) TARGET_PROTECTED="false" ;;
    *) TARGET_PROTECTED="unknown" ;;
  esac
  return 0
}
probe_target_protection "$TARGET"
echo "target=$TARGET protected=$TARGET_PROTECTED required_contexts=$(printf '%s' "$REQUIRED_CONTEXTS" | tr '\\n' ',')"

# Resolve the strategy. A protected target NEVER resolves to `direct` — that
# is the whole point of this gate, and the direct script carries a second
# independent guard in case this one is bypassed on a restart.
if [ -z "$MERGE_STRATEGY" ]; then
  case "$TARGET_PROTECTED" in
    true)
      MERGE_STRATEGY="pr-merge"
      echo "$TARGET is protected; defaulting merge_strategy=pr-merge."
      ;;
    unknown)
      # gh works but the probe failed (transient API error, odd permissions).
      # Fail closed to pr-merge: opening and merging a PR is correct on an
      # unprotected branch too, whereas a direct push to a protected branch
      # is simply rejected.
      MERGE_STRATEGY="pr-merge"
      echo "Could not determine protection for $TARGET; failing closed to merge_strategy=pr-merge."
      ;;
    *)
      # unknown_no_gh keeps the historical default: pr-merge needs gh for
      # `gh pr checks` / `gh pr merge`, so promoting it here would trade a
      # clean push rejection for a broken PR flow.
      MERGE_STRATEGY="direct"
      ;;
  esac
elif [ "$MERGE_STRATEGY" = "direct" ] && [ "$TARGET_PROTECTED" = "true" ]; then
  echo "metadata.merge_strategy=direct is invalid for protected $TARGET; using merge_strategy=pr-merge."
  MERGE_STRATEGY="pr-merge"
fi

if [ -n "$EXISTING_PR" ] && [ "$MERGE_STRATEGY" = "direct" ]; then
  echo "metadata.existing_pr requires pull-request handoff; using merge_strategy=mr."
  MERGE_STRATEGY="mr"
fi

# `mr` and `pr-merge` share the PR create/verify machinery below.
PR_MODE=false
case "$MERGE_STRATEGY" in
  mr|pr-merge) PR_MODE=true ;;
esac

if [ "$MERGE_STRATEGY" = "pr-merge" ] && ! command -v gh >/dev/null 2>&1; then
  echo "merge_strategy=pr-merge requires the gh CLI (gh pr checks / gh pr merge); the REST fallback cannot wait on checks or merge."
  gc mail send mayor/ -s "ESCALATION: pr-merge needs gh CLI" -m "Work bead: $WORK
Branch: $BRANCH
Target: $TARGET (protected=$TARGET_PROTECTED)
The refinery resolved merge_strategy=pr-merge but gh is not installed on this host.
Install gh, or set metadata.merge_strategy=mr to hand the PR to a human."
  echo "STOP. Do not mutate bead state."
  gc runtime drain-ack
  exit 1
fi

block_existing_pr() {
  reason="$1"
  gc bd update $WORK \
    --assignee="" \
    --set-metadata merge_result=blocked \
    --set-metadata gc.routed_to=human \
    --set-metadata blocked_reason="$reason"
  gc mail send mayor/ -s "ESCALATION: invalid existing_pr for $WORK" -m "$reason
Work bead: $WORK
Existing PR: $EXISTING_PR
Branch: $BRANCH
Target: $TARGET"
  CURRENT_WISP=$(gc gastown wisp-reconcile current) || {
    echo "Could not resolve the current wisp; not pouring and not burning."
    gc runtime drain-ack
    exit 1
  }
  if [ -z "$CURRENT_WISP" ]; then
    echo "Could not resolve current wisp; not burning."
    echo "$reason"
    echo "STOP. Existing PR metadata needs human correction."
    gc runtime drain-ack
    exit 1
  fi
  NEXT=$(gc gastown wisp-reconcile ensure mol-refinery-patrol --except "$CURRENT_WISP" --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}) || {
    echo "Could not guarantee exactly one next refinery wisp; not burning."
    gc runtime drain-ack
    exit 1
  }
  if [ -n "$CURRENT_WISP" ]; then
    gc bd mol burn "$CURRENT_WISP" --force
  else
    echo "Could not resolve current wisp; not burning."
    echo "$reason"
    echo "STOP. Existing PR metadata needs human correction."
    gc runtime drain-ack
    exit 1
  fi
  echo "$reason"
  echo "STOP. Existing PR metadata needs human correction."
  gc runtime drain-ack
  exit 1
}

branch_has_real_change() {
  # Shared false-completion predicate (0-diff/0-commit guard). Does
  # <branch-ref> introduce a real change vs its merge-base with
  # <target-ref>? Diff is authoritative — commit-count alone is a weaker
  # proxy because a branch can carry commits that net-zero — so we use
  # `git diff --quiet` and ALSO require >=1 commit beyond the base.
  #   exit 0 = real change (safe to merge / open PR)
  #   exit 1 = empty: no diff, or no commits, vs base (REFUSE close-as-merged)
  #   exit 2 = base/diff could not be computed: merge-base failed OR `git diff`
  #           itself errored (exit >1). Fail closed — a tool error is a suspect,
  #           not a licence to merge — so the caller halts, never improvises.
  bhrc_target="$1"
  bhrc_branch="$2"
  bhrc_base=$(git merge-base "$bhrc_target" "$bhrc_branch" 2>/dev/null) || return 2
  git diff --quiet "$bhrc_base" "$bhrc_branch"
  case "$?" in
    0) return 1 ;;  # no diff -> empty -> refuse
    1) : ;;         # diff present -> fall through to the commit-count check
    *) return 2 ;;  # git diff errored -> suspect -> refuse (fail closed)
  esac
  [ "$(git rev-list --count "$bhrc_base..$bhrc_branch" 2>/dev/null || echo 0)" -ge 1 ] || return 1
  return 0
}

halt_false_completion() {
  # branch_has_real_change tripped: a close-as-merged would assert "work was
  # merged" for a branch that merges to a no-op, which is definitionally
  # false. Halt-and-escalate (NEVER silent retry): leave the bead blocked
  # with a structured note, hand to human, nudge mayor + witness, then stop.
  # This surfaces the transient cause (e.g. session starvation -> 0-commit
  # polecat) instead of masking it.
  fc_branch="$1"
  fc_base="$2"
  gc bd update $WORK \
    --status=blocked \
    --assignee="" \
    --set-metadata merge_result=refused_false_completion \
    --set-metadata gc.routed_to=human \
    --set-metadata false_completion_suspected="branch $fc_branch no verified change vs $fc_base; refused merge-close"
  gc session nudge mayor "FALSE-COMPLETION HALT: $WORK — branch $fc_branch no verified change vs $fc_base; refused close-as-merged. Bead left blocked; NEVER silent retry."
  gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" "FALSE-COMPLETION HALT: $WORK — branch $fc_branch no verified change vs $fc_base; refused close-as-merged."
  echo "REFUSED close-as-merged: $WORK branch $fc_branch introduces no real change vs $fc_base."
  echo "STOP. Bead left blocked + escalated to mayor/witness. NEVER silent retry."
  gc runtime drain-ack
  exit 1
}

block_pr_checks() {
  # pr-merge terminal-blocked path: required checks are red, or the PR could
  # not be merged. Unlike block_existing_pr (bad config -> human) this is
  # fixable code, so it mirrors handle-failures and returns the bead to the
  # polecat pool with the reason attached.
  #
  # HARD RULES, in order of how badly each one has burned us:
  #   * NEVER push to $TARGET here. Red checks are exactly the case branch
  #     protection exists to stop; routing around it defeats the gate.
  #   * NEVER retry the push, and NEVER --force. A rejected push is a verdict,
  #     not a transient error.
  #   * NEVER close the bead. Work that did not land must stay open.
  #   * NEVER delete $BRANCH. The PR still points at it, and the next polecat
  #     resumes that branch instead of redoing the work.
  bpc_reason="$1"
  gc bd update $WORK \
    --status=open \
    --assignee="" \
    --set-metadata merge_result=blocked \
    --set-metadata rejection_reason="$bpc_reason" \
    --set-metadata pr_url="${PR_URL:-}" \
    --set-metadata pr_number="${PR_NUMBER:-}" \
    --set-metadata gc.routed_to="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat"
  gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" "PR BLOCKED: $WORK — $bpc_reason (PR ${PR_URL:-unknown}); bead returned to pool, branch kept."
  echo "BLOCKED: $WORK — $bpc_reason"
  echo "Bead returned to the polecat pool with rejection_reason set. Branch $BRANCH and PR ${PR_URL:-unknown} left intact."
}

pr_lookup_missing() {
  case "$1" in
    *"Could not resolve to a PullRequest"*|*"could not resolve to a PullRequest"*|*"no pull requests found"*|*"Not Found"*|*"not found"*|*"404"*) return 0 ;;
    *) return 1 ;;
  esac
}

pr_lookup_repo_mismatch() {
  case "$1" in
    *" belongs to repo "*", want "*) return 0 ;;
    *) return 1 ;;
  esac
}

resolve_github_token() {
  TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-${GIT_TOKEN:-}}}"
  if [ -n "$TOKEN" ]; then
    printf '%s\n' "$TOKEN"
    return
  fi
  printf 'protocol=https\nhost=github.com\n\n' \
    | GIT_TERMINAL_PROMPT=0 git credential fill 2>/dev/null \
    | sed -n 's/^password=//p' \
    | head -n 1
}

init_github_rest() {
  if [ -n "${API:-}" ] && [ -n "${TOKEN:-}" ]; then
    return 0
  fi
  if [ -n "$ORIGIN_REPO_ERROR" ]; then
    echo "$ORIGIN_REPO_ERROR" >&2
    return 1
  fi
  TOKEN=$(resolve_github_token)
  if [ -z "$TOKEN" ]; then
    echo "GitHub PR mode requires gh or a GitHub token available from env/git credential fill." >&2
    return 1
  fi
  case "$ORIGIN_REPO" in
    */*)
      OWNER=${ORIGIN_REPO%%/*}
      REPO=${ORIGIN_REPO#*/}
      ;;
    *)
      echo "Could not resolve standard github.com origin repository for REST fallback." >&2
      return 1
      ;;
  esac
  API="https://api.github.com/repos/$OWNER/$REPO"
}

curl_gh_api() {
  err_file="$1"
  shift
  curl -fsS \
    -H "Accept: application/vnd.github+json" \
    -H "Authorization: Bearer $TOKEN" \
    -H "Content-Type: application/json" \
    -H "X-GitHub-Api-Version: 2022-11-28" \
    "$@" 2>"$err_file"
}

lookup_pr_info() {
  ref="$1"
  err_file="$2"
  if command -v gh >/dev/null 2>&1; then
    gh pr view --json url,number,state,headRefName,baseRefName,headRepositoryOwner,headRepository -- "$ref" 2>"$err_file"
    return $?
  fi
  if ! init_github_rest 2>"$err_file"; then
    return 1
  fi
  PR_REF_REPO=$(printf '%s\n' "$ref" | sed -nE 's#^[Hh][Tt][Tt][Pp][Ss]://github.com/([^/]+/[^/]+)/pull/[0-9]+/?$#\\1#p' | head -n 1)
  if [ -n "$PR_REF_REPO" ] && [ "$PR_REF_REPO" != "$ORIGIN_REPO" ]; then
    echo "Pull request $ref belongs to repo $PR_REF_REPO, want $ORIGIN_REPO." >"$err_file"
    return 1
  fi
  PR_NUMBER=$(printf '%s\n' "$ref" | sed -nE 's#^[Hh][Tt][Tt][Pp][Ss]://github.com/[^/]+/[^/]+/pull/([0-9]+)/?$#\\1#p; s|^#([0-9]+)$|\\1|p; s|^([0-9]+)$|\\1|p' | head -n 1)
  if [ -z "$PR_NUMBER" ]; then
    PR_MATCHES=$(curl_gh_api "$err_file" \
      --get "$API/pulls" \
      --data-urlencode "state=open" \
      --data-urlencode "head=$OWNER:$ref" \
      --data-urlencode "base=$TARGET") || return 1
    PR_NUMBER=$(printf '%s\n' "$PR_MATCHES" | jq -r '.[0].number // empty')
  fi
  if [ -z "$PR_NUMBER" ]; then
    echo "Pull request $ref was not found." >"$err_file"
    return 1
  fi
  PR_RAW=$(curl_gh_api "$err_file" "$API/pulls/$PR_NUMBER") || return 1
  printf '%s\n' "$PR_RAW" \
    | jq '{url:.html_url, number, state:(.state | ascii_upcase), headRefName:.head.ref, baseRefName:.base.ref, headRepositoryOwner:{login:.head.repo.owner.login}, headRepository:{name:.head.repo.name}}'
}

if [ "$PR_MODE" = "true" ] && [ -n "$EXISTING_PR" ]; then
  if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
    block_existing_pr "metadata.existing_pr is set but metadata.branch is missing."
  fi

  if [ -z "$ORIGIN_REPO" ]; then
    [ -n "$ORIGIN_REPO_ERROR" ] && echo "$ORIGIN_REPO_ERROR"
    echo "Could not resolve origin repository for existing PR validation. STOP. Debug and retry without mutating bead state."
    gc runtime drain-ack
    exit 1
  fi

  EXISTING_PR_ERR=$(mktemp)
  EXISTING_PR_INFO=$(lookup_pr_info "$EXISTING_PR" "$EXISTING_PR_ERR")
  EXISTING_PR_STATUS=$?
  EXISTING_PR_ERROR=$(cat "$EXISTING_PR_ERR")
  rm -f "$EXISTING_PR_ERR"
  if [ "$EXISTING_PR_STATUS" -ne 0 ] || [ -z "$EXISTING_PR_INFO" ]; then
    if pr_lookup_repo_mismatch "$EXISTING_PR_ERROR"; then
      block_existing_pr "Existing PR $EXISTING_PR is not in $ORIGIN_REPO. $EXISTING_PR_ERROR"
    fi
    if pr_lookup_missing "$EXISTING_PR_ERROR"; then
      block_existing_pr "Existing PR $EXISTING_PR was not found or is not accessible."
    fi
    echo "Could not resolve existing PR $EXISTING_PR. STOP. Debug and retry without mutating bead state."
    [ -n "$EXISTING_PR_ERROR" ] && echo "$EXISTING_PR_ERROR"
    gc runtime drain-ack
    exit 1
  fi

  EXISTING_PR_STATE=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.state')
  EXISTING_PR_HEAD=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.headRefName')
  EXISTING_PR_BASE=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.baseRefName')
  EXISTING_PR_URL=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.url')
  EXISTING_PR_REPO=$(printf '%s\n' "$EXISTING_PR_URL" | sed -E 's#^https://github.com/([^/]+/[^/]+)/pull/[0-9]+$#\\1#')
  EXISTING_PR_HEAD_REPO=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')

  if [ "$EXISTING_PR_STATE" != "OPEN" ]; then
    block_existing_pr "Existing PR $EXISTING_PR is $EXISTING_PR_STATE, want OPEN."
  fi
  if [ "$EXISTING_PR_HEAD" != "$BRANCH" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets branch $EXISTING_PR_HEAD, want $BRANCH."
  fi
  if [ "$EXISTING_PR_BASE" != "$TARGET" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets base $EXISTING_PR_BASE, want $TARGET."
  fi
  if [ "$EXISTING_PR_REPO" != "$ORIGIN_REPO" ]; then
    block_existing_pr "Existing PR $EXISTING_PR belongs to repo $EXISTING_PR_REPO, want $ORIGIN_REPO."
  fi
  if [ "$EXISTING_PR_HEAD_REPO" != "$ORIGIN_REPO" ]; then
    block_existing_pr "Existing PR $EXISTING_PR head repo $EXISTING_PR_HEAD_REPO, want $ORIGIN_REPO."
  fi
fi

if [ "$PR_MODE" = "true" ] && [ -z "$ORIGIN_REPO" ]; then
  [ -n "$ORIGIN_REPO_ERROR" ] && echo "$ORIGIN_REPO_ERROR"
  echo "Could not resolve origin repository for pull-request handoff. STOP. Debug and retry without mutating bead state."
  gc runtime drain-ack
  exit 1
fi
```

**If MERGE_STRATEGY = "direct" (unprotected targets only):**

**0. Merge-state gate (already-merged short-circuit + false-completion guard):**

Two failure modes share this gate, so evaluate them in one script that shares
shell state — an early `exit` in the already-merged branch below then provably
prevents the false-completion guard in this same script from running on a
closed bead. That `exit` does NOT drain: an already-merged close is a real
completion, so it skips the merge script and joins the normal path's
Cleanup -> patrol-summary -> next-iteration tail (pour next wisp, burn this
one), exactly like a normal merge. Only genuine errors drain-ack.

- **Already merged (close, do NOT halt):** a previous refinery pass merged this
  branch and the polecat crashed before the bead closed. That is a real
  completion, so close it as merged with `merged_sha` forensics rather than let
  the 0-diff guard escalate a done bead to a human. An ancestor check alone is
  not enough: a 0-commit branch is trivially an ancestor of the target (its tip
  is still the fork point), so gate the close on the branch also carrying >=1
  commit since its recorded `metadata.fork_sha`. Without `fork_sha` recorded,
  stay conservative and fall through to the false-completion guard.
- **False completion (halt):** a branch that introduces no change vs its
  merge-base is definitionally not a merge. Refuse it before touching `$TARGET`.
  Legit no-op resolutions use wontfix/duplicate/not-planned, never merged — so
  this never blocks a real merge.

```bash
FORK_SHA=$(gc bd show "$WORK" --json | jq -r '.[0].metadata.fork_sha // empty')
if ! git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"; then
  echo "git fetch failed; cannot evaluate merge state. STOP. Do not mutate bead state."
  gc runtime drain-ack
  exit 1
fi
git merge-base --is-ancestor "origin/$BRANCH" "origin/$TARGET"
ANCESTOR_STATUS=$?
case "$ANCESTOR_STATUS" in
  0)
    REAL_COMMITS=0
    if [ -n "$FORK_SHA" ]; then
      REAL_COMMITS=$(git rev-list --count "$FORK_SHA..origin/$BRANCH" 2>/dev/null || echo 0)
    fi
    if [ -n "$FORK_SHA" ] && [ "$REAL_COMMITS" -ge 1 ]; then
      ALREADY_SHA=$(git rev-parse "origin/$BRANCH")
      ALREADY_SHORT=$(git rev-parse --short "origin/$BRANCH")
      DEPLOY_NOTE=$(gc gastown deploy-check "$ALREADY_SHA" --stamp "$WORK" 2>/dev/null || true)
      if gc bd update "$WORK" \
           --set-metadata merge_result=already_merged \
           --set-metadata merged_sha="$ALREADY_SHA" \
           --set-metadata merged_target="$TARGET" \
           --unset-metadata rejection_reason && \
         gc bd close "$WORK" --reason "Already merged to $TARGET at $ALREADY_SHORT (branch is an ancestor of target; closed instead of halting)$DEPLOY_NOTE"; then
        echo "ALREADY_MERGED: origin/$BRANCH is an ancestor of origin/$TARGET with $REAL_COMMITS commit(s) since fork — closed $WORK as merged. Skip the merge script; run Cleanup, then patrol-summary + next-iteration."
        exit 0
      fi
      # The update/close did not land (transient API failure). Do NOT report
      # merged with the bead still open; STOP so a later patrol retries.
      echo "ALREADY_MERGED close failed for $WORK; bead still open. STOP; a later patrol will retry."
      gc runtime drain-ack
      exit 1
    fi
    # Ancestor but no recorded real commits: a 0-commit branch. Fall through to
    # the false-completion guard, which refuses to close it as merged.
    ;;
  1) : ;;  # not an ancestor -> a normal merge candidate; fall through
  *)
    echo "git merge-base --is-ancestor errored (status $ANCESTOR_STATUS); cannot evaluate already-merged. STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac

branch_has_real_change "origin/$TARGET" temp
BHRC_STATUS=$?
case "$BHRC_STATUS" in
  0) : ;;  # verified real change -> continue to the merge script below
  1) halt_false_completion "$BRANCH" "$(git merge-base "origin/$TARGET" temp 2>/dev/null || printf '%s' "origin/$TARGET")" ;;
  *)
    echo "branch_has_real_change could not evaluate temp vs origin/$TARGET (tool error, status $BHRC_STATUS). STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac
```
If this block closed the bead as already-merged, the merge is already done:
SKIP the merge script (step 1 below) and go straight to **2. Cleanup**, then
let this step complete so **patrol-summary** and **next-iteration** run (they
pour the next wisp and burn this one) — the same tail a normal merge takes. Do
NOT drain-ack here; that would strand the loop and leak the merged branch.
Otherwise the branch has a verified real change and you continue to the merge.

**1. Merge, push, verify, and close work bead:**

Run this as one script. It uses a temporary detached worktree for the
target branch because the real target branch may already be checked out in
the rig's main worktree. Do not replace this with `git checkout $TARGET`.
The metadata write happens only after the merge is proven to have landed.

Do NOT pipe any command in this script (no `| tee`, no `| head`). A failure
inside a pipeline does not trip `set -e` — only the last command's status is
seen — which is how a failed merge previously reached the close as a success.

Verification is three independent gates, because comparing the remote to a
value that was itself read from the remote proves nothing. `MERGED_SHA` is
read from a worktree created at `origin/$TARGET`, so if the merge aborts it
still equals `$REMOTE` and the SHA comparison passes vacuously. `PRE_SHA`
catches a merge that advanced nothing, and the `--is-ancestor` check is the
only gate that cannot pass vacuously: `$TEMP_SHA` comes from the branch, not
from the target, so it is satisfied only if the work actually landed.

```bash
set -euo pipefail

MERGE_PARENT=$(mktemp -d "${TMPDIR:-/tmp}/gascity-refinery-merge.XXXXXX")
MERGE_WT="$MERGE_PARENT/target"
cleanup_merge_wt() {
  git worktree remove --force "$MERGE_WT" >/dev/null 2>&1 || true
  rm -rf "$MERGE_PARENT"
}
trap cleanup_merge_wt EXIT

git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
TEMP_SHA=$(git rev-parse temp)
git worktree add --detach "$MERGE_WT" "origin/$TARGET"
PRE_SHA=$(git -C "$MERGE_WT" rev-parse HEAD)
git -C "$MERGE_WT" merge --ff-only "$TEMP_SHA"
MERGED_SHA=$(git -C "$MERGE_WT" rev-parse HEAD)
MERGED_SHORT=$(git -C "$MERGE_WT" rev-parse --short HEAD)
if [ "$MERGED_SHA" = "$PRE_SHA" ]; then
  echo "MERGE ADVANCED NOTHING — target worktree is still at $PRE_SHA after merging $TEMP_SHA (the merge did not apply). STOP. Do not mutate bead state."
  gc runtime drain-ack
  exit 1
fi

# Second, independent protected-target guard. Strategy resolution should have
# already routed a protected $TARGET to pr-merge, so reaching here means that
# gate was bypassed — a stale metadata.merge_strategy, a restart that skipped
# the resolution block, or protection enabled mid-patrol. Re-probe from
# scratch rather than trusting a variable that may not have survived: a
# direct push to a protected branch is exactly the failure this bead fixes.
# The probe no-ops when gh is unavailable, preserving the pre-gh behaviour of
# letting GitHub reject the push.
if command -v gh >/dev/null 2>&1 && [ -n "${ORIGIN_REPO:-}" ]; then
  DIRECT_PROTECTED=$(gh api "repos/$ORIGIN_REPO/branches/$TARGET" --jq '.protected' 2>/dev/null || echo unknown)
  if [ "$DIRECT_PROTECTED" = "true" ]; then
    echo "REFUSING direct push: $TARGET is a protected branch and merge_strategy=direct has no legal route to it."
    echo "Set metadata.merge_strategy=pr-merge (or clear it and let strategy resolution pick) and re-run."
    echo "Do NOT disable protection, add a bypass, or use --force. STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
  fi
fi

git -C "$MERGE_WT" push origin "HEAD:$TARGET"

git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
REMOTE=$(git rev-parse "origin/$TARGET")
if [ "$MERGED_SHA" != "$REMOTE" ]; then
  echo "PUSH FAILED — origin/$TARGET is $REMOTE, want $MERGED_SHA. STOP. Do not mutate bead state."
  gc runtime drain-ack
  exit 1
fi

CONTAINED_STATUS=0
git merge-base --is-ancestor "$TEMP_SHA" "$REMOTE" || CONTAINED_STATUS=$?
case "$CONTAINED_STATUS" in
  0) : ;;  # work commit is provably contained in the pushed target
  1)
    echo "MERGE NOT LANDED — $TEMP_SHA is not an ancestor of origin/$TARGET ($REMOTE). STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
  *)
    echo "git merge-base --is-ancestor errored (status $CONTAINED_STATUS); cannot verify the merge landed. STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac

DEPLOY_NOTE=$(gc gastown deploy-check "$MERGED_SHA" --stamp "$WORK" 2>/dev/null || true)

gc bd update "$WORK" \
  --set-metadata merge_result=merged \
  --set-metadata merged_sha="$MERGED_SHA" \
  --set-metadata merged_target="$TARGET" \
  --unset-metadata rejection_reason && \
gc bd close "$WORK" --reason "Merged to $TARGET at $MERGED_SHORT$DEPLOY_NOTE"
```

If the script exits non-zero: STOP. Debug and retry. Do NOT write merge
metadata, close the bead, or delete the source branch.

Both the `--set-metadata` write and the `gc bd close` are required —
`merged_sha` and `merged_target` are the only forensic breadcrumbs tying a
closed bead to its merge commit on `$TARGET`. `--unset-metadata
rejection_reason` clears any stale rejection field from an earlier
rejected/reworked attempt before the successful close.

**`DEPLOY_NOTE` — closing asserts authorship, so state deployment separately.**

A close proves the patch is an ancestor of `$TARGET`. It does NOT prove anyone
RUNS it: a city reads a commit pinned in `packs.lock`, and advancing that pin is
a separate act (`gc import install` + `gc reload`) that no close path performs or
waits for. Three P1 pack fixes were closed while still live as bugs — gp-haf,
gp-dlq and gp-px5 — and read exactly like the beads beside them that were
genuinely fixed. `gc gastown deploy-check` records which one this is (gp-apx).

The same one-line call precedes every close in this formula. Keep it that way:
the deployment rule drifted into three independent copies once already, as
gp-dlq's reconcile query did, which is why it lives in one tested place.

- It NEVER blocks the close. The merge landed, and the refinery cannot advance a
  pin, so refusing to close would jam the queue on every fix and fix nothing.
- `|| true` is required, not defensive. A non-zero exit is a VERDICT (1 = not
  deployed, 2 = undetermined, 3 = not applicable), and this block runs under
  `set -euo pipefail`, where it would otherwise abort a landed merge.
- `2>/dev/null` keeps the evidence lines out of `$DEPLOY_NOTE`; stdout carries
  only the reason suffix, which is empty for an ordinary application rig.
- Pass the commit that represents THE FIX, never the current tip of `$TARGET`. A
  tip that has moved past the pin reports "not deployed" for a fix the pin
  genuinely contains.

The verdict also lands in `metadata.deploy_status`, so closed-but-undeployed work
is queryable rather than only legible in the close reason.

**2. Cleanup:**
```bash
git checkout --detach "origin/$TARGET" >/dev/null 2>&1 || true
git branch -d temp || git branch -D temp || true
```
If delete_merged_branches = "true": `git push origin --delete $BRANCH`

**If MERGE_STRATEGY = "mr" OR "pr-merge" (i.e. `$PR_MODE` = true):**

Refinery does NOT land the branch directly. It publishes a pull request.
Steps 0-3 are identical for both strategies; they diverge at step 4:

- `mr` stops there. PR creation IS the terminal handoff — a human takes it
  from the open PR, and the bead closes as `merge_result=pull_request`.
- `pr-merge` continues through steps 4a-4c: wait for required checks, merge
  the PR, verify `$TARGET` actually advanced, and only then close the bead.
  This is the mode that lands work on a protected branch.

**0. Refuse a 0-diff branch (false-completion guard):**

The same predicate covers the empty-PR / 0-commit concern: do not publish a
pull request for a branch that introduces no change vs its merge-base. The
refinery closes the bead on a verified merge of that PR, so an empty PR is
the same false completion as an empty direct merge — it just arrives later,
once someone merges the nothing it contains. A tool error (status 2) is not
an empty branch — stop without mutating bead state rather than
halt-escalating a healthy branch.
```bash
branch_has_real_change "origin/$TARGET" temp
BHRC_STATUS=$?
case "$BHRC_STATUS" in
  0) : ;;  # verified real change -> continue to publish the PR
  1) halt_false_completion "$BRANCH" "$(git merge-base "origin/$TARGET" temp 2>/dev/null || printf '%s' "origin/$TARGET")" ;;
  *)
    echo "branch_has_real_change could not evaluate temp vs origin/$TARGET (tool error, status $BHRC_STATUS). STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac
```

**1. Push the rebased branch back to origin:**
```bash
git checkout temp
git push origin HEAD:$BRANCH --force-with-lease
```
If `--force-with-lease` fails, the existing PR branch moved after your
fetch. STOP, fetch the latest branch, rebase your temp branch again, and
retry with `--force-with-lease`. Do not use plain `--force`.

**2. Reuse, create, or discover the pull request:**

Read the bead's description and notes once and stage them into a PR body
file (using `--body-file` avoids quoting/encoding hazards with multi-line
markdown). The body always carries the bead's full description (the
"why"), and includes the polecat's implementation notes (the "what")
when present.

```bash
WORK_JSON=$(gc bd show $WORK --json)
EXISTING_PR=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata.existing_pr // empty')
ISSUE_TITLE=$(printf '%s' "$WORK_JSON" | jq -r '.[0].title')
ISSUE_DESC=$(printf '%s' "$WORK_JSON" | jq -r '.[0].description // empty')
ISSUE_NOTES=$(printf '%s' "$WORK_JSON" | jq -r '.[0].notes // empty')
ISSUE_TYPE=$(printf '%s' "$WORK_JSON" | jq -r '.[0].issue_type // "task"')
ISSUE_PRIORITY=$(printf '%s' "$WORK_JSON" | jq -r '.[0].priority // empty')

PR_BODY_FILE=$(mktemp)
{
  echo "## Summary"
  echo
  if [ -n "$ISSUE_DESC" ]; then
    printf '%s\n' "$ISSUE_DESC"
  else
    printf 'Refinery handoff for `%s` (no bead description recorded).\n' "$WORK"
  fi
  if [ -n "$ISSUE_NOTES" ]; then
    echo
    echo "## Implementation notes"
    echo
    printf '%s\n' "$ISSUE_NOTES"
  fi
  echo
  echo "## Refinery handoff"
  echo
  printf -- '- Issue: `%s` (%s%s)\n' "$WORK" "$ISSUE_TYPE" "${ISSUE_PRIORITY:+, P$ISSUE_PRIORITY}"
  printf -- '- Source branch: `%s`\n' "$BRANCH"
  printf -- '- Target: `%s`\n' "$TARGET"
  printf -- '- Rebased on `%s` via Gastown Refinery.\n' "$TARGET"
} > "$PR_BODY_FILE"

if [ -n "$EXISTING_PR" ]; then
  PR_REF="$EXISTING_PR"
else
  if command -v gh >/dev/null 2>&1; then
    PR_URL=$(gh pr create \
      --base "$TARGET" \
      --head "$BRANCH" \
      --title "$ISSUE_TITLE ($WORK)" \
      --body-file "$PR_BODY_FILE" 2>/dev/null || true)

    if [ -z "$PR_URL" ]; then
      PR_URL=$(gh pr view "$BRANCH" --json url -q '.url')
    fi
  else
    PR_ERR=$(mktemp)
    if ! init_github_rest 2>"$PR_ERR"; then
      cat "$PR_ERR"
      rm -f "$PR_ERR"
      gc runtime drain-ack
      exit 1
    fi
    EXISTING=$(curl_gh_api "$PR_ERR" \
      --get "$API/pulls" \
      --data-urlencode "state=open" \
      --data-urlencode "head=$OWNER:$BRANCH" \
      --data-urlencode "base=$TARGET")
    PR_STATUS=$?
    PR_ERROR=$(cat "$PR_ERR")
    if [ "$PR_STATUS" -ne 0 ]; then
      echo "GitHub API request failed while checking for an existing PR for $BRANCH."
      [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
      rm -f "$PR_ERR"
      gc runtime drain-ack
      exit 1
    fi
    PR_NUMBER=$(printf '%s\n' "$EXISTING" | jq -r '.[0].number // empty')
    if [ -z "$PR_NUMBER" ]; then
      CREATE_PAYLOAD=$(jq -n \
        --arg title "$ISSUE_TITLE ($WORK)" \
        --arg head "$BRANCH" \
        --arg base "$TARGET" \
        --rawfile body "$PR_BODY_FILE" \
        '{title:$title, head:$head, base:$base, body:$body}')
      CREATED=$(curl_gh_api "$PR_ERR" \
        -X POST "$API/pulls" \
        -d "$CREATE_PAYLOAD")
      PR_STATUS=$?
      PR_ERROR=$(cat "$PR_ERR")
      if [ "$PR_STATUS" -ne 0 ]; then
        echo "GitHub API request failed while creating a PR for $BRANCH."
        [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
        rm -f "$PR_ERR"
        gc runtime drain-ack
        exit 1
      fi
      PR_NUMBER=$(printf '%s\n' "$CREATED" | jq -r '.number // empty')
      if [ -z "$PR_NUMBER" ]; then
        echo "GitHub API response did not include a pull request number."
        rm -f "$PR_ERR"
        gc runtime drain-ack
        exit 1
      fi
    fi
    PR_RAW=$(curl_gh_api "$PR_ERR" "$API/pulls/$PR_NUMBER")
    PR_STATUS=$?
    PR_ERROR=$(cat "$PR_ERR")
    rm -f "$PR_ERR"
    if [ "$PR_STATUS" -ne 0 ]; then
      echo "GitHub API request failed while reading PR $PR_NUMBER."
      [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
      gc runtime drain-ack
      exit 1
    fi
    PR_URL=$(printf '%s\n' "$PR_RAW" | jq -r '.html_url // empty')
  fi
  PR_REF="$BRANCH"
fi

rm -f "$PR_BODY_FILE"
```

**3. Verify the pull request exists:**
```bash
PR_ERR=$(mktemp)
PR_INFO=$(lookup_pr_info "$PR_REF" "$PR_ERR")
PR_STATUS=$?
PR_ERROR=$(cat "$PR_ERR")
rm -f "$PR_ERR"
if [ "$PR_STATUS" -ne 0 ] || [ -z "$PR_INFO" ]; then
  if [ -n "$EXISTING_PR" ] && pr_lookup_missing "$PR_ERROR"; then
    block_existing_pr "Existing PR $EXISTING_PR was not found or is not accessible."
  fi
  echo "Pull request $PR_REF was not found."
  [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
  gc runtime drain-ack
  exit 1
fi
PR_URL=$(printf '%s\n' "$PR_INFO" | jq -r '.url')
PR_NUMBER=$(printf '%s\n' "$PR_INFO" | jq -r '.number')
PR_STATE=$(printf '%s\n' "$PR_INFO" | jq -r '.state')
PR_HEAD=$(printf '%s\n' "$PR_INFO" | jq -r '.headRefName')
PR_BASE=$(printf '%s\n' "$PR_INFO" | jq -r '.baseRefName')
PR_REPO=$(printf '%s\n' "$PR_URL" | sed -E 's#^https://github.com/([^/]+/[^/]+)/pull/[0-9]+$#\\1#')
PR_HEAD_REPO=$(printf '%s\n' "$PR_INFO" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')
echo "$PR_URL $PR_NUMBER $PR_STATE $PR_HEAD $PR_BASE $PR_REPO $PR_HEAD_REPO"
if [ "$PR_STATE" != "OPEN" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR is $PR_STATE, want OPEN."
  fi
  echo "Pull request $PR_REF is $PR_STATE, want OPEN."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_HEAD" != "$BRANCH" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets branch $PR_HEAD, want $BRANCH."
  fi
  echo "Pull request $PR_REF targets branch $PR_HEAD, want $BRANCH."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_BASE" != "$TARGET" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets base $PR_BASE, want $TARGET."
  fi
  echo "Pull request $PR_REF targets base $PR_BASE, want $TARGET."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_REPO" != "$ORIGIN_REPO" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR belongs to repo $PR_REPO, want $ORIGIN_REPO."
  fi
  echo "Pull request $PR_REF belongs to repo $PR_REPO, want $ORIGIN_REPO."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_HEAD_REPO" != "$ORIGIN_REPO" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR head repo $PR_HEAD_REPO, want $ORIGIN_REPO."
  fi
  echo "Pull request $PR_REF head repo $PR_HEAD_REPO, want $ORIGIN_REPO."
  gc runtime drain-ack
  exit 1
fi
```
If this command fails or prints empty output: STOP. Debug and retry. Do NOT continue.

**4. `mr` ONLY — Park the bead at `awaiting_merge`. Do NOT close it:**

Skip this entire step when `MERGE_STRATEGY = "pr-merge"`; go to 4a. For
`pr-merge` the PR is a means, not the deliverable, and closing here would
report work as handed off while `$TARGET` never moved.

**An open pull request is not a merge, so it is not a completion.** This
step used to close the bead the moment the PR verified as OPEN, and that is
the defect this formula now fixes. A closed bead leaves `gc bd ready`,
pool-demand queries, and orphan scans in the same instant, so a PR that
nobody merges loses every tracking handle at once: no open bead, no
assignee, no sling. Nothing re-dispatches it and nothing merges it, and
because the PR is green the whole time, nothing looks wrong. Measured
against the GitHub API in rig tallyup, beads closed 40-78 minutes before
their PR merged, and one never merged at all.

So record the PR and PARK the bead: leave it OPEN, still assigned to the
refinery, marked `awaiting_merge=true`. Step 1 of `find-work` polls it on
every patrol and closes it once the merge is VERIFIED landed. Until then it
stays visible to `gc bd ready` and to every patrol that scans open work.

`awaiting_merge_since_epoch` carries the seconds-since-epoch that
`find-work` does staleness arithmetic on; parsing an RFC3339 stamp back to
epoch portably needs `date -d` on GNU and `date -j -f` on BSD/macOS, and
the refinery runs on both. `awaiting_merge_since` is the same instant kept
human-readable for whoever reads the bead.

```bash
# --- AWAITING_MERGE_PARK ---
gc bd update $WORK \\
  --status=open \\
  --set-metadata merge_result=pull_request_open \\
  --set-metadata pr_url="$PR_URL" \\
  --set-metadata pr_number="$PR_NUMBER" \\
  --set-metadata merged_target="$TARGET" \\
  --set-metadata awaiting_merge=true \\
  --set-metadata awaiting_merge_since="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \\
  --set-metadata awaiting_merge_since_epoch="$(date -u +%s)" \\
  --unset-metadata rejection_reason
echo "AWAITING_MERGE: $WORK parked open at $PR_URL; find-work closes it once the merge is verified."
```

**FORBIDDEN in `mr` mode**: `gc bd close $WORK` here, or any
`merge_result=merged` write. The merge has not happened yet — a human has
not touched the PR. Recording one is a false completion, and it is the
exact bug that stranded three green PRs in a day.

**4a. `pr-merge` ONLY — Wait for the required checks to settle:**

Waiting happens inside `gh pr checks --watch`, which blocks until every
required check reaches a terminal state. Do NOT hand-roll a `sleep` polling
loop: some agent harnesses refuse a foreground `sleep`, and a loop that is
silently skipped turns "wait for green" into "merge immediately".

Bound the wait so a check that is never scheduled cannot hold the refinery
open forever. `timeout(1)` is not present on every host (it is GNU
coreutils; macOS ships it only via Homebrew as `timeout`/`gtimeout`), so
degrade to an unbounded watch with a loud warning rather than failing.

`gh pr checks` exit codes are load-bearing and easy to misread:

| Exit | Meaning | Action |
|---|---|---|
| 0 | every required check passed | merge |
| 8 | still pending | keep watching |
| 124 | our `timeout` fired | blocked, report pending checks |
| 1 | **either** a check failed **or** zero checks were reported | must disambiguate — see below |

That last row is the trap. `gh` exits 1 for "CI is red" and for "this repo
has no required checks at all", which are opposite verdicts. Disambiguate on
stdout, not on the exit code: a real failure yields JSON rows with
`bucket == "fail"`, whereas nothing-reported yields empty stdout and a "no
required checks reported" message on stderr.

```bash
CHECKS_TIMEOUT=${REFINERY_CHECKS_TIMEOUT_SECONDS:-1800}
CHECKS_INTERVAL=${REFINERY_CHECKS_INTERVAL_SECONDS:-30}

run_bounded_checks() {
  if command -v timeout >/dev/null 2>&1; then
    timeout "$CHECKS_TIMEOUT" gh pr checks "$PR_NUMBER" --required --watch --interval "$CHECKS_INTERVAL"
  elif command -v gtimeout >/dev/null 2>&1; then
    gtimeout "$CHECKS_TIMEOUT" gh pr checks "$PR_NUMBER" --required --watch --interval "$CHECKS_INTERVAL"
  else
    echo "WARNING: no timeout(1) on PATH; watching required checks unbounded." >&2
    gh pr checks "$PR_NUMBER" --required --watch --interval "$CHECKS_INTERVAL"
  fi
}

run_bounded_checks
WATCH_STATUS=$?

CHECKS_ERR=$(mktemp)
CHECKS_JSON=$(gh pr checks "$PR_NUMBER" --required --json name,state,bucket,link 2>"$CHECKS_ERR")
CHECKS_STATUS=$?
CHECKS_ERROR=$(cat "$CHECKS_ERR")
rm -f "$CHECKS_ERR"

FAILED_NAMES=""
PENDING_NAMES=""
if [ -n "$CHECKS_JSON" ]; then
  FAILED_NAMES=$(printf '%s' "$CHECKS_JSON" | jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | unique | join(", ")' 2>/dev/null)
  PENDING_NAMES=$(printf '%s' "$CHECKS_JSON" | jq -r '[.[] | select(.bucket == "pending") | .name] | unique | join(", ")' 2>/dev/null)
fi

CHECKS_VERDICT=""
CHECKS_DETAIL=""
if [ "$WATCH_STATUS" -eq 124 ]; then
  CHECKS_VERDICT="timeout"
  CHECKS_DETAIL="${PENDING_NAMES:-unknown}"
elif [ -n "$FAILED_NAMES" ]; then
  CHECKS_VERDICT="red"
  CHECKS_DETAIL="$FAILED_NAMES"
elif [ "$CHECKS_STATUS" -eq 0 ] && [ -n "$CHECKS_JSON" ]; then
  CHECKS_VERDICT="green"
elif [ -z "$CHECKS_JSON" ] && printf '%s' "$CHECKS_ERROR" | grep -qi 'no .*checks reported'; then
  # gh sees no required checks. Believe it only if branch protection also
  # lists none — otherwise protection demands contexts that were never
  # scheduled, and merging would be merging past an unenforced gate.
  if [ -n "$REQUIRED_CONTEXTS" ]; then
    CHECKS_VERDICT="unscheduled"
    CHECKS_DETAIL=$(printf '%s' "$REQUIRED_CONTEXTS" | tr '\\n' ',' | sed 's/,$//')
  else
    CHECKS_VERDICT="none"
  fi
elif [ "$CHECKS_STATUS" -eq 8 ] || [ -n "$PENDING_NAMES" ]; then
  CHECKS_VERDICT="timeout"
  CHECKS_DETAIL="${PENDING_NAMES:-unknown}"
else
  CHECKS_VERDICT="error"
  CHECKS_DETAIL="$CHECKS_ERROR"
fi

echo "checks verdict=$CHECKS_VERDICT detail=$CHECKS_DETAIL (watch=$WATCH_STATUS query=$CHECKS_STATUS)"

case "$CHECKS_VERDICT" in
  green)
    echo "PROCEED: required checks green for PR #$PR_NUMBER."
    ;;
  none)
    echo "PROCEED: neither gh nor branch protection reports a required check for $TARGET; nothing to wait on."
    ;;
  red)
    block_pr_checks "required checks failing: $CHECKS_DETAIL"
    echo "SKIP steps 4b and 4c. Go to step 5 Cleanup."
    ;;
  timeout)
    block_pr_checks "required checks did not finish within ${CHECKS_TIMEOUT}s; still pending: $CHECKS_DETAIL"
    echo "SKIP steps 4b and 4c. Go to step 5 Cleanup."
    ;;
  unscheduled)
    block_pr_checks "branch protection requires checks that were never reported on this PR: $CHECKS_DETAIL"
    echo "SKIP steps 4b and 4c. Go to step 5 Cleanup."
    ;;
  *)
    echo "Could not read required checks for PR #$PR_NUMBER: $CHECKS_DETAIL"
    echo "STOP. Do not mutate bead state, do not merge, do not push."
    gc runtime drain-ack
    exit 1
    ;;
esac
```

**If the verdict was `red`, `timeout`, or `unscheduled`:** `block_pr_checks`
has already set `merge_result=blocked` + `rejection_reason` and returned the
bead to the polecat pool. Do NOT run 4b or 4c. Do NOT push to `$TARGET`, do
NOT retry, do NOT `--force`, do NOT delete `$BRANCH`. Go to step 5 Cleanup,
then let **patrol-summary** and **next-iteration** run so the patrol
continues with the next branch.

**4b. `pr-merge` ONLY — Merge the pull request:**

Capture `$TARGET` and the PR head BEFORE merging. Both are needed by 4c, and
`PR_HEAD_SHA` in particular is the only verification input that does not
come from `$TARGET` — it is what makes the containment check in 4c
non-vacuous.

```bash
git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
PRE_MERGE_SHA=$(git rev-parse "origin/$TARGET")
PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q '.headRefOid')
if [ -z "$PR_HEAD_SHA" ]; then
  echo "Could not read head SHA for PR #$PR_NUMBER. STOP. Do not mutate bead state."
  gc runtime drain-ack
  exit 1
fi

MERGE_ERR=$(mktemp)
gh pr merge "$PR_NUMBER" --merge \
  --subject "Merge PR #$PR_NUMBER: $ISSUE_TITLE ($WORK)" \
  >"$MERGE_ERR" 2>&1
PR_MERGE_STATUS=$?
PR_MERGE_OUTPUT=$(cat "$MERGE_ERR")
rm -f "$MERGE_ERR"
echo "$PR_MERGE_OUTPUT"

if [ "$PR_MERGE_STATUS" -ne 0 ]; then
  block_pr_checks "gh pr merge failed for PR #$PR_NUMBER: $PR_MERGE_OUTPUT"
  echo "SKIP step 4c. Go to step 5 Cleanup."
fi
```

A `gh pr merge` failure is a verdict from the branch's own protection rules
— a missing approving review, an out-of-date branch, a required
conversation unresolved. It is NOT a transient error. Report it and stop.
Never respond by pushing to `$TARGET`, disabling protection, adding the
refinery to a bypass list, or re-running with `--admin`/`--force`.

**4c. `pr-merge` ONLY — Verify the merge landed, then record and close:**

GitHub reporting a successful merge is not proof that `$TARGET` moved, and
the merge ref can lag the API response by a beat. Re-fetch and prove it with
two gates:

1. `$TARGET` advanced (`POST_MERGE_SHA != PRE_MERGE_SHA`) — catches a merge
   that reported success but applied nothing.
2. `PR_HEAD_SHA` is an ancestor of the new `$TARGET` — the non-vacuous gate.
   Gate 1 compares two values both read from `$TARGET`, so it can pass on an
   unrelated concurrent push; `PR_HEAD_SHA` comes from the PR branch, so
   gate 2 is satisfied only if THIS work actually landed.

Retry the fetch a bounded number of times to absorb the propagation lag,
using `gh pr checks`-free polling via `git fetch` alone (no `sleep`: each
`git fetch` round-trip is itself the delay).

```bash
MERGE_VERIFY_TRIES=${REFINERY_MERGE_VERIFY_TRIES:-10}
POST_MERGE_SHA=""
VERIFY_OK=false
i=0
while [ "$i" -lt "$MERGE_VERIFY_TRIES" ]; do
  i=$((i + 1))
  git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" >/dev/null 2>&1 || true
  POST_MERGE_SHA=$(git rev-parse "origin/$TARGET" 2>/dev/null || echo "")
  if [ -n "$POST_MERGE_SHA" ] && [ "$POST_MERGE_SHA" != "$PRE_MERGE_SHA" ] \
     && git merge-base --is-ancestor "$PR_HEAD_SHA" "$POST_MERGE_SHA" 2>/dev/null; then
    VERIFY_OK=true
    break
  fi
done

if [ "$VERIFY_OK" != "true" ]; then
  echo "MERGE NOT VERIFIED — origin/$TARGET is ${POST_MERGE_SHA:-unreadable} (was $PRE_MERGE_SHA); $PR_HEAD_SHA is not provably contained after $i attempts."
  echo "gh pr merge reported success, so do NOT re-merge and do NOT push. STOP. Do not mutate bead state; a later patrol re-evaluates via the already-merged gate."
  gc runtime drain-ack
  exit 1
fi

MERGED_SHORT=$(git rev-parse --short "$POST_MERGE_SHA")
DEPLOY_NOTE=$(gc gastown deploy-check "$POST_MERGE_SHA" --stamp "$WORK" 2>/dev/null || true)

gc bd update $WORK \
  --set-metadata merge_result=merged \
  --set-metadata merged_sha="$POST_MERGE_SHA" \
  --set-metadata merged_target="$TARGET" \
  --set-metadata pr_url="$PR_URL" \
  --set-metadata pr_number="$PR_NUMBER" \
  --unset-metadata rejection_reason && \
gc bd close $WORK --reason "Merged to $TARGET at $MERGED_SHORT via PR #$PR_NUMBER: $PR_URL$DEPLOY_NOTE"
```

`$DEPLOY_NOTE` carries the deployment verdict; see the `direct` path above for
why a close cannot assert it and why `|| true` is mandatory here.

If the verification script exits non-zero: STOP. Do NOT write merge
metadata, close the bead, or delete the source branch.

**5. Cleanup:**
```bash
git checkout "$TARGET"
git branch -d temp
```
Do NOT delete `$BRANCH` in `mr` mode — the open pull request needs it.

Do NOT delete `$BRANCH` in `pr-merge` mode either when the bead was blocked
— the PR is still open and the next polecat resumes that branch. Only after
a verified merge, and only if delete_merged_branches = "true", may you run
`git push origin --delete $BRANCH`.

**If MERGE_STRATEGY = "local":**

STOP. Local-only merge handoff is not implemented in the Gastown example pack.
Leave the work bead assigned to refinery and escalate to mayor for manual handling:
```bash
gc mail send mayor/ -s "ESCALATION: unsupported merge_strategy=local" -m "Work bead: $WORK
Branch: $BRANCH
Target: $TARGET
The Gastown example refinery supports direct, mr/pr, and pr-merge strategies only."
```
Do NOT close the bead, delete the branch, or burn the wisp until a human decides how to proceed.

**GATE**: `direct` requires an unprotected target AND a verified target push.
`mr` requires a verified PR URL to PARK the bead, and a verified merge —
GitHub `mergedAt`, or content-aware git evidence — before `find-work` may
close it. `pr-merge` requires green (or absent) required checks, a successful
`gh pr merge`, AND a re-fetched `$TARGET` that provably contains the PR head.

**Bead closure requires a merge that has been verified to have landed. A
published pull request is not one.** The verification must be content-aware:
the refinery rebases and GitHub rewrites again on squash/rebase merges, so
`git merge-base --is-ancestor` reports "not merged" for work that landed.
Match patch IDs (`git cherry`), or trust the API's `mergedAt`.

**FORBIDDEN, in every mode**: disabling branch protection, `git push --force`
or `--force-with-lease` to `$TARGET`, `gh pr merge --admin`, adding the
refinery to a protection bypass list, or editing CI config (e.g.
`continue-on-error`) to turn a red check green. A protected branch rejecting
your push is the system working. Report it and return the bead to the pool."""

[[steps]]
id = "patrol-summary"
title = "Record patrol cycle summary"
needs = ["merge-push"]
description = """
Summarize this patrol cycle for handoff context. This becomes the
audit trail — the next refinery session can see what happened.

Include:
- Branch merged (name, target)
- Test results (pass/fail, which checks ran)
- Bugs filed (IDs, if any pre-existing failures were tracked)
- Rejections (if the branch was rejected back to pool)
- Any escalations sent

If the cycle ended early (conflict rejection, no work found), note
why and what state was left.

This summary is not stored separately — it lives in the wisp's
closing reason. The next session can find it via `gc bd list --type=molecule
--include-infra --status=closed --limit=5` if it needs predecessor context."""

[[steps]]
id = "next-iteration"
title = "Prepare next patrol iteration"
needs = ["patrol-summary"]
description = """
**Config: integration_branch_auto_land = {{integration_branch_auto_land}}**

**1. Integration branch check (only if auto_land = "true"):**

If the merge target was an integration branch, check if the parent
owned convoy is now fully closed:
```bash
gc bd list --type=convoy --status=open
```
For each owned convoy with an integration branch: if ALL children are
closed, assign the convoy bead itself to you with the metadata needed
for a merge:
```bash
gc bd update <convoy-id> --assignee=$GC_AGENT \
  --set-metadata branch=<integration-branch> \
  --set-metadata target={{target_branch}}
```
The next patrol iteration picks up the convoy like any other work bead
and merges the integration branch to {{target_branch}} normally.

**FORBIDDEN**: Landing integration branches via raw `git merge`/`git push`.
The convoy bead assignment is the ONLY path.

If auto_land = "false": skip this entirely.

**2. Resolve the current wisp, pour next iteration, then burn this wisp:**
```bash
CURRENT_WISP=$(gc gastown wisp-reconcile current) || {
  echo "Could not resolve the current wisp; not pouring and not burning."
  gc runtime drain-ack
  exit 1
}
NEXT=$(gc gastown wisp-reconcile ensure mol-refinery-patrol --except "$CURRENT_WISP" --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}) || {
  echo "Could not guarantee exactly one next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
}
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
```

Close this step. The new wisp is ready — re-read formula steps to begin."""
