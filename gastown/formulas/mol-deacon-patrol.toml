# CONTRACT PIN — read before editing this file.
#
# The gastown-orchestration gate pins literal text fragments from this formula
# in GASTOWN_FORMULA_CONTRACTS / GASTOWN_BUILD_WORKFLOW_CONTRACTS
# (scripts/gascity_pack_inference_gate.py). Nothing below marks which lines they
# are, so list them before you edit:
#
#   python3 scripts/gascity_pack_inference_gate.py --list-formula-contracts mol-deacon-patrol
#
# Dropping a pinned fragment fails the gate and gets the branch rejected. If the
# contract genuinely changed, update the registry in the SAME commit — never
# delete a pin just to go green.
description = """
Deacon patrol loop. Poured as a root-only wisp on startup:

  gc gastown wisp-reconcile ensure mol-deacon-patrol --var binding_prefix='{{binding_prefix}}'

That command pours AND assigns, and pours only if the agent does not
already own a wisp. Never bootstrap with a bare `gc bd mol wisp` — an
unguarded pour leaks a wisp on every restart.

Each wisp is ONE iteration: check inbox, run town-wide coordination
tasks, pour the next iteration. On crash, re-read the formula steps
and determine where you left off from context.

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: every exit path (happy or early) pours the next
wisp before burning this one. The prompt only bootstraps the first wisp.

## Deacon Role

The deacon is the **LLM sidekick to the controller**. It handles periodic
tasks that require judgment or observation — things the Go controller
can't or shouldn't do.

1. **Work-layer health** — are witnesses and refineries making progress?
   (Not "are they running" — that's the controller's job.)
2. **Utility agent health** — detect stuck dogs, dispatch shutdown dance.
3. **Orphan process cleanup** — kill leaked claude/node subagent processes.
4. **System diagnostics** — run `gc doctor`, act on findings.

Mechanical tasks (gate evaluation, cross-rig deps, orphan bead sweeps,
wisp compaction) are handled by exec orders in the Gas City builtin
core pack — no LLM needed. The retired maintenance pack no longer exists.

## Idle Town Principle

The deacon should be silent/invisible when the town is healthy and idle.
Skip health checks when no active work exists. Use exponential backoff
between patrol cycles.

## What the deacon does NOT do

- Start/stop/restart agents (controller handles this)
- Per-rig orphaned bead recovery (witness handles this)
- Code implementation (polecats do this)
- Kill agents directly (files warrants, dog pool runs shutdown dance)
- Pool sizing (controller pool reconciliation)

Read each step's description before acting — Config values override defaults."""
formula = "mol-deacon-patrol"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.event_timeout]
description = "Seconds to sleep before re-checking. Replaces former event-watch loop which hot-spun on cache-reconcile firehose."
default = "60"

[vars.witness_stale_min]
description = "Minutes of witness heartbeat silence before health-scan's deterministic pass calls the patrol loop stalled. The default is 1.5x the witness idle_timeout (1h) — the longest legitimate silence for a healthy witness, and an order of magnitude under the multi-hour stalls this catches. Lower it only if your witness idle_timeout is lower."
default = "90"

[vars.starvation_stale_min]
description = "Minutes a coordination or merge session may hold a non-empty queue without the queue changing before queue-starvation-check calls it starved. The default is ~6x the 300s max patrol backoff: these agents cycle in seconds when work is present, so half an hour of silence on a non-empty queue is an eternity rather than a lull."
default = "30"

[vars.starvation_polecat_min]
description = "The same window for polecats, which legitimately spend longer inside a single implement step. Deliberately a longer window rather than an exemption — exempting polecats is how a stuck one becomes invisible."
default = "120"

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
description = """
**1. Context check (FIRST — before any work):**
```bash
RSS=$(ps -o rss= -p $$ | tr -d ' ')
RSS_MB=$((RSS / 1024))
```

If RSS > 1500 MB or context feels heavy, request a restart:
```bash
gc runtime request-restart
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks
forever. The controller will kill and restart the session on the next
reconcile tick. The current wisp stays assigned and the new session
the new session re-reads formula steps and resumes from context.

**2. Check mail:**
```bash
gc mail inbox
```

Handle each message type:

**HELP / Escalation:**
Assess the request. Can you help directly? If not, escalate:
```bash
gc mail send mayor/ -s "ESCALATION: <agent> needs help" -m "<details>"
```
Archive after handling.

**DOG_DONE:**
A utility agent completed its task (e.g., shutdown dance, dep
propagation). Note the outcome for observability. Archive.

**Other / informational:**
Archive after reading.

**Hygiene principle**: Archive messages after they're fully processed.
Inbox should be near-empty after this step.

Close this step and proceed."""

[[steps]]
id = "orphan-process-cleanup"
title = "Kill orphaned claude subagent processes"
needs = ["check-inbox"]
description = """
Claude Code's Task tool spawns subagent processes that sometimes don't
clean up. These accumulate and consume significant memory.

**Candidate generation — NOT a list of orphans:**

```bash
ps aux | grep -E 'claude|node' | grep '?'
```

**This query names suspects, never convicts.** It matches on command text and
TTY, and neither answers who is running a process. On 2026-07-31 it returned 95
processes on a healthy town containing ZERO orphans (gp-aik): five separate
cities' tmux servers, Discord and Claude.app helpers, a gemini node process,
live MCP servers, and every live agent in this town — all 11 of which shared the
live tmux server as their parent.

Worst of all it matches **this town's own tmux server**. `ps aux` prints that
server's full argv, which contains the `exec claude ...` it launched, so it
matches a 'claude' grep. It then sits at ppid=1 with TTY `?` — satisfying both
heuristics this step used to call proof of orphanhood. Killing it takes down
every agent in the town, including the deacon running this step.

**Triage every candidate before proposing any kill. This is mandatory:**

```bash
gc gastown kill-triage --pid <pid>            # repeat --pid per candidate
```

Invoke it through `gc`, not by path. `GC_PACK_DIR` is unset in your session, so
a path invocation resolves to `/assets/scripts/...`, fails its own guard, and
prints nothing — which for a triage whose entire job is to REFUSE reads exactly
like a clean bill of health.

| verdict | meaning | action |
|---------|---------|--------|
| `refuse-not-ours` | ancestry/cwd place it in another city, or nowhere we can claim | leave it alone — not ours to kill |
| `refuse-live-agent` | descends from this town's session host | leave it alone — it is working |
| `refuse-session-host` | it IS a session host, or has live children | NEVER kill — takes dependents with it |
| `refuse-not-zombie` | reported as a zombie, but the kernel disagrees | leave it alone |
| `refuse-unverifiable` | state unreadable | leave it alone; unreadable is not permission |
| `kill-candidate` | ours, abandoned, hosting nothing | may be killed |

Exit 2 means the triage could not run — bad city context, or a pack version
without it. **Nothing was triaged, so kill nothing** and report it:
```bash
gc mail send mayor/ -s "DEACON: kill-triage cannot run" -m "<the triage's stderr>"
```

**Action — only for pids the triage returned as `kill-candidate`:**
```bash
kill <pid>
```

`ppid=1` is a hypothesis, not proof. Reparenting to init is what a genuine
orphan looks like AND what the town's session host looks like AND what every
daemon on the host looks like; on its own it distinguishes nothing. The triage
is what separates them, which is why it is mandatory here rather than advisory.

**Do not restore "use judgment" here.** That instruction is what this step used
to rely on, and it is precisely what failed: judgment does not survive the
fresh-context restarts these agents run on, and a silently-wrong signal is
indistinguishable from a correct one at the point of use. gp-9ur required pane
corroboration before any WARRANT for the same reason. This is that rule on the
KILL path, which gp-9ur does not cover.

Close this step after check (even if no orphans found)."""

[[steps]]
id = "health-scan"
title = "Check work-layer health"
needs = ["orphan-process-cleanup"]
description = """
Monitor whether work is flowing through rig coordination agents.
The controller handles "is the agent running?" The deacon handles
"is work progressing?"

**Skip docked/parked rigs.** Only check active rigs.

**Deterministic first pass — witness heartbeat freshness.**

**Config: witness_stale_min = {{witness_stale_min}}**

Run this before forming any judgment. A witness whose self-scheduled patrol
loop has died still reports a healthy session state: it sits `asleep` or
`active` and reads as legitimate idle in every other signal in this step. The
controller sees a live session, and wisp staleness on an idle rig is
indistinguishable from a healthy lull. Patrol stalls of 14h to 63h were
observed in production exactly this way, with no alert. Heartbeat age is the
one signal that separates "idle and fine" from "the loop is gone", so it gets
measured rather than judged.

```bash
GASTOWN_WITNESS_STALE_MIN={{witness_stale_min}} gc gastown witness-heartbeat-check
echo "heartbeat check exit: $?"
```

Route it through `gc`, never as a path under `$GC_PACK_DIR`: gc sets that
variable for pack COMMANDS and it is unset in your shell, so a direct path
resolves to `/assets/scripts/...` and measures nothing. This step shipped that
way and the check never ran once (gp-3qb) — the `[ -x ]` guard it sat behind
turned the unset variable into a skip that printed a considered-sounding
fallback, so every patrol logged a clean health scan it had not performed.

Exit 0 means every checked witness heartbeat is inside the window. Exit 1 means
findings, one TSV row per witness
(`verdict rig session state age_seconds heartbeat`):

| verdict | meaning | action |
|---------|---------|--------|
| `fresh` | heartbeat inside the window | nothing |
| `stalled` | heartbeat older than the window — the patrol loop MAY be gone | peek the pane first; if it corroborates, nudge, then warrant if the stall survives the nudge |
| `no-heartbeat` | no usable timestamp recorded yet | do NOT warrant. A freshly-spawned witness has no heartbeat yet; only a no-heartbeat that persists across cycles is a real signal |

Exit 2 means the check could not run — bad config, an unreadable session
roster, or a `gc session list` schema drift that hid `last_active`. That is
"freshness was NOT measured", not health. Escalate the drift the way
`recover-orphaned-beads` does in `mol-witness-patrol`:

```bash
gc mail send mayor/ -s "DEACON: witness heartbeat check cannot run" -m "<the check's stderr>"
```

**A `stalled` verdict is a reason to LOOK, never on its own grounds for a
warrant.** Corroborate it against the pane before you escalate:

```bash
gc session peek "$STALLED_SESSION" --lines 30
```

The check answers "when did this session last stamp a heartbeat?" The pane
answers "is this session doing anything right now?" Those are different
questions, and only the second one can justify a shutdown dance. **If the check
and the pane disagree, BELIEVE THE PANE** — active output means the measurement
is wrong, not the witness. File a defect against the check and do not warrant.

This is not hypothetical caution. On 2026-07-31 this check reported all three
witnesses `stalled` (14.1h/21.5h/22.3h) while all three were alive and mid-turn,
one of them mid `worktree-reap --reap`. Its BSD `date -j -f %z` arm could not
parse the `±HH:MM` offset `gc session list` emits for `last_active`, so that
field never parsed, scored 0, and the newest-stamp pick could only ever choose
`last_nudge_delivered_at`. The check silently stopped measuring liveness and
measured nudge age instead — reporting `stalled` for any witness not nudged
inside the window, and blind to genuine stalls at the same time. Three healthy
witnesses came one compliant step from a dog-pool shutdown dance. What stopped
it was an agent looking at the pane and refusing to believe its own query.
(That specific parser bug is fixed — do not re-fix it here. The rule below is
what survives it.)

The rule generalizes past that one bug: a silently-wrong signal is
indistinguishable from a correct one at the point of use, so being mechanical
never exempts a verdict from corroboration. Looking is the only thing that
separates the two, which is why it is mandatory here rather than advisory —
the next wrong signal will not announce itself either.

Once the pane corroborates that the session is genuinely not progressing, it
takes the same escalation route as everything else in this step — nudge first,
so a witness that is merely wedged mid-turn gets to recover on its own:

```bash
gc session nudge "$STALLED_SESSION" "Heartbeat silent for <age>. Run gc hook and resume your patrol."
```

If the next cycle still reports the same session `stalled` **and the pane still
shows no progress**, file a deduped warrant with the snippet at the end of this
step. Do not invent a second escalation path, and do not mail a named role
directly for a single stall — systemic patterns are what the mayor escalation at
the end of this step is for.

**For each active rig, assess witness health:**

Check witness patrol wisp freshness. Each patrol cycle burns a wisp.
If the last wisp is much older than the maximum backoff cap (300s) plus
buffer, the witness may be stuck. But if there's no active work in the
rig, the witness is legitimately idle — not stuck. Idle only excuses a stale
*wisp*: an empty queue does not stop a live witness from waking, so if the
heartbeat pass returned `stalled`, idleness alone does not clear it.

What clears it is the pane, not the queue. A quiet rig is not evidence the
witness is fine, and a `stalled` verdict is not evidence it is broken — only
`gc session peek` distinguishes them, and it outranks both.

**For each active rig, assess refinery health:**

Check refinery patrol wisp freshness + queue state:
- Wisp recently burned → healthy (actively cycling)
- Wisp open, no work assigned to refinery → idle, fine
- Wisp open, work assigned to refinery, stale `UpdatedAt` → stuck

**No hardcoded thresholds.** Read wisp timestamps, queue state, and
the nature of the current work. Make a judgment call about whether
something is stuck. This is exactly why an LLM does it, not Go code.

**For stuck coordination agents, file a warrant (deduped).**

Check for an existing open warrant against the same target first — a duplicate
warrant spawns a second shutdown dance racing the first (duplicate kills,
wasted dog cycles). Skip filing if one is already open or in progress:
```bash
TARGET_SESSION="<session>"
EXISTING_WARRANT=$(gc bd list --label=warrant --json --limit=0 \
  | jq -r --arg t "$TARGET_SESSION" \
      '[.[] | select((.status == "open" or .status == "in_progress") and (.metadata.target == $t))] | length')
if [ "${EXISTING_WARRANT:-0}" -gt 0 ]; then
  echo "Skipping warrant for $TARGET_SESSION — an open warrant already exists."
else
  gc bd create --type=task --label=warrant \
    --title="Stuck: <session>" \
    --metadata '{"target":"<session>","reason":"<reason>","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
fi
```

The dog pool runs `mol-shutdown-dance` for due process.

**Escalate to mayor** only for systemic issues (multiple rigs affected,
patterns of failure).

Close this step after assessment."""

[[steps]]
id = "queue-starvation-check"
title = "Cross-check assigned work against visible work signal"
needs = ["health-scan"]
description = """
Cross-check assigned work against visible work signal. A session can
look healthy-idle in a patrol wisp view while its queue is silently
starving — the refinery (upstream #1833) self-polled for 13h42m with
seven beads in its queue and no visible work signal, because its poll
filter resolved to an identity that didn't match its own.

The deacon's wisp-freshness check catches "no patrol activity" but not
"active polling, wrong filter, queue silently piling up." This step
closes that gap.

**Config: starvation_stale_min = {{starvation_stale_min}}**
**Config: starvation_polecat_min = {{starvation_polecat_min}}**

**Step 1: Measure. Do not eyeball this.**

```bash
STARVE_OUT=$(mktemp)
STARVE_ERR=$(mktemp)
GASTOWN_STARVATION_STALE_MIN={{starvation_stale_min}} \\
GASTOWN_STARVATION_POLECAT_MIN={{starvation_polecat_min}} \\
    gc gastown queue-starvation-check >"$STARVE_OUT" 2>"$STARVE_ERR"
STARVE_RC=$?
```

For every session in a working state the check computes the pair this step
has always been about, and prints one TSV row per session:

    verdict  rig  session  role  queued  age_seconds  identity

- `queued` = open+in_progress beads assigned to that session, counted across
  BOTH assignee spellings. `--assignee` is an exact match and Gas Town writes
  two: a polecat self-claim lands the session NAME
  (`gastown__polecat-gk-s4j0`), a refinery handoff lands the agent ADDRESS
  (`meety-local/gastown.refinery`).
- `age_seconds` = time since the newest `updated_at` in that queue — the work
  signal. Every claim, status transition, metadata update or note bumps it.

Verdicts: `idle` (no work — healthy), `working` (queue moved inside the
window), `starved` (queue has not moved), and `schema-drift` /
`query-failed`, which mean nothing was measured for that session.

Exit codes: 0 = all idle or working, 1 = findings on stdout, 2 = could not run.

**Step 2: Decide what the exit status means BEFORE reading any rows.**

```bash
if [ "$STARVE_RC" -eq 2 ] || { [ "$STARVE_RC" -ne 0 ] && [ ! -s "$STARVE_OUT" ]; }; then
    echo "queue-starvation-check DID NOT RUN: $(head -1 "$STARVE_ERR")"
    # Carry this into the patrol summary as UNMEASURED and stop treating the
    # work layer as scanned. Never record a clean health scan on the strength
    # of a check that did not run.
fi
```

A non-zero exit with empty stdout is `gc` refusing to dispatch the
subcommand — a city whose pack pin predates this command — not a clean
queue. Keeping those two apart is the entire reason this step was rewritten
(gp-b3x). What it replaced called `gc agents list --json --active`, which
does not exist: `gc` printed an `{"ok":false}` envelope to stdout and exited
1, but the call sat at the head of a pipeline whose status the shell takes
from the tail, so nothing noticed and jq turned the envelope into zero rows.
It also queried `--status=open`, which cannot see a CLAIMED bead, and probed
a single identity namespace. Each fault produced zero rows; zero rows read as
an empty queue. The step returned A=0 for every session forever and reported
clean — so upstream #1833, the incident it exists to catch, would have passed
it silently. A detector whose failure mode is silence has the same defect
class as the thing it detects.

**Step 3: Apply judgment to the `starved` rows.**

The check measures; you decide. It never nudges, mails, or files warrants —
those are this step's calls, and routing them through an LLM is the point.
Weigh each starved row:
- Coordination agents (refinery, witness) cycle in seconds when work is
  present, so a starved verdict on one is strong evidence.
- Polecats already get the longer `starvation_polecat_min` window, so a
  starved polecat has been silent well past a normal implement step.
- A freshly-assigned bead gets `updated_at` at assignment time; an age of
  hours means the session took the work and never acted on it.
- `schema-drift` and `query-failed` rows are findings about the CHECK, not
  about the session. Never warrant on one — report it and get it fixed.

**Step 4: For flagged sessions, nudge first, then warrant:**

`$STUCK_SESSION` is the `session` column of the starved row and `$QUEUED` its
`queued` column — take them from the row, not from a count you recomputed by
hand.

```bash
gc session nudge "$STUCK_SESSION" "Queue has $QUEUED beads (open+in_progress), no bead activity for <duration>. Run gc hook."
```

If the nudge doesn't unstick within the next patrol cycle, escalate
by filing a warrant for the dog pool. Check for an existing open warrant
against the same target first — a duplicate warrant spawns a second shutdown
dance racing the first:

```bash
TARGET_SESSION="<session>"
EXISTING_WARRANT=$(gc bd list --label=warrant --json --limit=0 \
    | jq -r --arg t "$TARGET_SESSION" \
        '[.[] | select((.status == "open" or .status == "in_progress") and (.metadata.target == $t))] | length')
if [ "${EXISTING_WARRANT:-0}" -gt 0 ]; then
    echo "Skipping warrant for $TARGET_SESSION — an open warrant already exists."
else
    gc bd create --type=task --label=warrant \
        --title="Stuck queue: <session> — $QUEUED beads, no activity $duration" \
        --metadata '{"target":"<session>","reason":"queue starvation: N beads, no bead.updated_at progress","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
fi
```

The dog runs `mol-shutdown-dance` and the controller respawns a fresh
session that re-reads the queue with a correct filter.

**Step 5: A genuinely-idle session (no assigned beads) is NOT flagged.**
The check reports those as `idle` and they are healthy — an idle-but-ready
refinery or witness is what a quiet town looks like. Flagging them is how a
starvation detector gets muted.

Close this step after the check has run and every `starved` row has been
acted on or explicitly dismissed. If the check DID NOT RUN, say so in the
patrol summary — an unmeasured work layer is not a healthy one."""

[[steps]]
id = "utility-agent-health"
title = "Check utility agent (dog) health"
needs = ["queue-starvation-check"]
description = """
Detect utility agents (dogs) that are alive but stuck on their work.

The controller detects dead agents. But "working too long" is a
work-layer judgment: is this task genuinely slow, or is the agent stuck?
The controller can't know this. The deacon can, by checking bead and
wisp timestamps.

**Step 1: Find active utility agent work:**
```bash
gc bd list --status=in_progress --metadata-field gc.routed_to={{binding_prefix}}dog --json --limit=0
```

**Step 2: For each, assess progress:**

Check the work bead's `UpdatedAt` and the agent's wisp freshness.
Consider the nature of the work — a shutdown dance with 240s timeouts
will naturally take longer than a quick dep propagation.

No hardcoded thresholds. Use judgment.

**Step 3: For stuck utility agents, file a warrant (deduped).**

Check for an existing open warrant against the same target first — a duplicate
warrant spawns a second shutdown dance racing the first:
```bash
TARGET_SESSION="<session>"
EXISTING_WARRANT=$(gc bd list --label=warrant --json --limit=0 \
  | jq -r --arg t "$TARGET_SESSION" \
      '[.[] | select((.status == "open" or .status == "in_progress") and (.metadata.target == $t))] | length')
if [ "${EXISTING_WARRANT:-0}" -gt 0 ]; then
  echo "Skipping warrant for $TARGET_SESSION — an open warrant already exists."
else
  gc bd create --type=task --label=warrant \
    --title="Stuck dog: <agent>" \
    --metadata '{"target":"<session>","reason":"<reason>","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
fi
```

A different dog from the pool picks up the warrant and runs the
shutdown dance. If the pool is at capacity with all dogs stuck,
escalate to mayor.

Close this step after assessment."""

[[steps]]
id = "dolt-health"
title = "Run Dolt data-plane health check"
needs = ["utility-agent-health"]
description = """
Run `gc dolt health --json` to inspect the Dolt data plane and flag anomalies.

This step surfaces problems that individual patrol steps won't catch:
commit bloat (compactor dog may have failed), stale backups (backup dog
may have failed), orphan databases, and zombie Dolt server processes.

**Step 1: Run the health check**
```bash
gc dolt health --json
```

Parse the JSON output (HealthReport schema):
- `server`: running, reachable, pid, port, latency_ms
- `databases[]`: name, commits, open_beads
- `backups`: dolt_freshness, dolt_age_seconds, dolt_stale
- `processes`: zombie_count, zombie_pids
- `orphans[]`: name, size

Note: `--json` always exits 0 when the payload is well-formed; health
state is signalled in-band. Key decisions off `server.reachable`, not
`server.running` — a process can hold the port while its goroutines
are wedged (the latter is what first prompted this check to exist).

**Step 2: Evaluate thresholds**

| Signal | Threshold | Meaning |
|--------|-----------|---------|
| `server.reachable == false` | — | Dolt server is down or unresponsive (CRITICAL) |
| `server.latency_ms > 5000` | 5 s | Server may be overloaded |
| `databases[].commits > 50000` | 50 k | Compactor dog may have stalled |
| `backups.dolt_stale == true` | >30 min | Backup dog may have failed |
| `processes.zombie_count > 0` | any | Advisory only — the name lies. NOT Unix zombies, and NOT safe to kill; triage per-PID first |
| `orphans` non-empty | any | Advisory only — NEVER act on this count directly; verify with `gc dolt-cleanup` (hyphen, dry-run) first |

**Step 3: React to alerts**

**Server down (CRITICAL):** `server.reachable == false` — either no
process is listening on the port, or a process is listening but not
answering SQL (wedged goroutines, migration lock, saturated pool).
```bash
gc mail send mayor/ -s "ESCALATION: Dolt server unreachable [CRITICAL]" \\
  -m "gc dolt health reports server.reachable=false"
```

**Commit bloat (commits > 50k in any DB):**
The compactor dog (`mol-dog-compactor`) may have failed. Log for awareness.
If the compactor order is configured, it will self-dispatch. Otherwise
nudge the dog pool:
```bash
gc session nudge dog/ "Compactor needed: <db_name> has <count> commits"
```

**Stale backups:**
The backup dog (`mol-dog-backup`) may have failed. Same pattern — log and
nudge if order hasn't self-healed:
```bash
gc session nudge dog/ "Backup needed: dolt backup is <age> old"
```

**"Zombie" processes (`processes.zombie_count > 0`):**

**`zombie_count` does not mean Unix zombie, and it is not a kill list.** It
counts Dolt servers the reporter did not expect on this port — a live, healthy,
in-use server is exactly the shape that gets counted. Read it as "servers I
cannot account for", never as "processes safe to reap".

On 2026-07-31 this reported `zombie_count=1`, pid 61677, on a healthy town
(gp-aik). That pid was `stat=Ss` — not `Z` — six minutes old, 669MB resident,
with `ppid=36698`: a LIVE agent that had spawned it and was actively using it.
Killing it breaks that agent mid-task. This was at least the second occurrence;
a prior cycle found 2 of 14 flagged servers live and in use.

**Triage every reported pid before proposing any kill. This is mandatory:**

```bash
gc gastown kill-triage --require-zombie --pid <zombie_pid>
```

`--require-zombie` adds the check the field name only implies: the kernel must
actually report `stat=Z`. It also refuses a server with a live ancestor or live
children, which is what makes "somebody's working server" distinguishable from
a leak. Invoke it through `gc`, not by path — `GC_PACK_DIR` is unset in your
session, and a path invocation prints nothing, which reads like a clearance.

Kill ONLY pids it returns as `kill-candidate`. Every `refuse-*` verdict, and
exit 2 (could not run — nothing was triaged), means leave the process alone:
```bash
kill <pid>    # only for a pid the triage returned as kill-candidate
```

If the triage refuses everything the reporter flagged, that is a finding about
the reporter, not about the servers. Log it and move on; do not escalate a
single cycle's disagreement, and never split the difference by killing "just the
obvious ones" — obviousness is the property that was wrong both times.

**Orphan DBs (`orphans` non-empty):**
Do NOT act on the health `orphans` count directly — the reporter can
false-positive live rig databases as orphans, and a forced removal on that
count would destroy a live rig ledger (unrecoverable). Confirm against the
rig-protected dry-run authority first:
```bash
gc dolt-cleanup --json    # hyphen, Go-side: dry-run, rig-protected
```
Real orphans are exactly the databases it lists under `dropped.names`
(`rigs_protected` are already excluded). If `dropped.names` is empty, there
is nothing to clean — the health `orphans` entries are live rig DBs (a
reporter false-positive); log and move on. `gc dolt-cleanup` (hyphen,
the Go-side command) is dry-run by default; removal happens only under
`--force`. Do NOT rely on the `gc dolt cleanup` (space) pack-script's
defaults — always use the hyphen command for orphan inspection/cleanup.
Reclaim confirmed orphans only via human-approved
`gc dolt-cleanup --force` escalated to mayor — never run a destructive
`--force` automatically from this step, and never
`gc dolt cleanup --force --server-down-ok` against a reachable server (it can
`rm -rf` an open database and corrupt NBS, #1549).

**If everything is healthy:**
Log `Dolt health: OK` and move on.

**Exit criteria:** Health check run, alerts handled or escalated."""

[[steps]]
id = "system-health"
title = "Run system diagnostics"
needs = ["dolt-health"]
description = """
Run `gc doctor` for a quick workspace health check.

```bash
gc doctor
```

**For simple findings:** Act directly (e.g., stale lock files, temp
directory cleanup).

**For complex findings:** Escalate to mayor with context:
```bash
gc mail send mayor/ -s "DOCTOR: <finding>" -m "<details>"
```

Close this step after check."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["system-health"]
description = """
**Config: event_timeout = {{event_timeout}}**

End of patrol cycle. Pour the next iteration, then wait or exit.

**1. Context check:**

If context feels heavy or RSS is high:
```bash
gc runtime request-restart
```
This blocks forever. The controller restarts you. The next wisp
is already assigned — the new session resumes from context.

**2. Quick inbox check (end-of-cycle hygiene):**
```bash
gc mail inbox
```
Handle any urgent messages that arrived during patrol. Archive the rest.

**3. Resolve current wisp and pour next iteration BEFORE burning:**

This pour is guarded. Pouring unconditionally is what leaked wisps: a restart
that already queued a successor would pour a second one, every cycle, forever.
`gc gastown wisp-reconcile ensure` reuses an already-queued wisp when one exists and
pours only when none does — and never hands back the wisp you are running now,
which step 4 is about to burn.
```bash
CURRENT_WISP=$(gc gastown wisp-reconcile current) || {
  echo "Could not resolve the current deacon wisp; not pouring and not burning."
  gc runtime drain-ack
  exit 1
}
NEXT=$(gc gastown wisp-reconcile ensure mol-deacon-patrol --except "$CURRENT_WISP" --var binding_prefix='{{binding_prefix}}') || {
  echo "Could not guarantee exactly one next deacon wisp; not burning."
  gc runtime drain-ack
  exit 1
}
echo "next wisp: $NEXT"
```

**4. Burn this wisp before waiting:**
```bash
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current deacon wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
```

Do not sleep with the current wisp still open. The backoff belongs to the
already-assigned successor wisp; if the session restarts during the sleep, the
successor remains the single resumable patrol item.

**5. Exit this turn:**
Write exactly:
```
IDLE: no work, exiting turn.
```
Then stop immediately. Do NOT sleep, call ScheduleWakeup, or use Monitor.
The session_sleep policy will restart this session after the configured idle interval;
the next wisp is already assigned and the restarted session resumes from it.

**Exit criteria:** Next wisp poured and assigned, this wisp burned, turn ended with IDLE signal."""
